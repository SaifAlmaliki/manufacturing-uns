# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: UNS Asset Model

on:
  push:
    branches:
      - "**"
    paths:
      - "00_uns_config/**/*.py"
      - "00_uns_config/pyproject.toml"
      - "09_uns_model/**/*.py"
      - "09_uns_model/pyproject.toml"
      - "09_uns_model/uv.lock"
      - "09_uns_model/alembic.ini"
      - "09_uns_model/Dockerfile"
      - ".github/workflows/uns_model-app.yml"
      - ".github/include/**"

  pull_request:
    branches:
      - "**"
    paths:
      - "00_uns_config/**/*.py"
      - "00_uns_config/pyproject.toml"
      - "09_uns_model/**/*.py"
      - "09_uns_model/pyproject.toml"
      - "09_uns_model/uv.lock"
      - "09_uns_model/alembic.ini"
      - "09_uns_model/Dockerfile"
      - ".github/workflows/uns_model-app.yml"
      - ".github/include/**"

  workflow_dispatch:
    inputs:
      pytest_add_opts: # trunk-ignore(checkov/CKV_GHA_7)
        description: "additional pytest options"
        type: string

permissions:
  contents: read

jobs:
  generate_random_password:
    runs-on: ubuntu-latest
    outputs:
      postgres_pwd: ${{ steps.random_strings.outputs.postgres_pwd }}
      uns_historian_pwd: ${{ steps.random_strings.outputs.uns_historian_pwd}}
    steps:
      - id: random_strings
        run: |
          echo "postgres_pwd=$(openssl rand -base64 32 | tr -dc '[:alnum:]')" >> $GITHUB_OUTPUT
          echo "uns_historian_pwd=$(openssl rand -base64 32 | tr -dc '[:alnum:]')" >> $GITHUB_OUTPUT

  build_code:
    runs-on: ubuntu-latest
    needs: generate_random_password
    environment: dev
    env:
      # The Asset Model shares the historian's database, so it reads the same keys.
      UNS_historian__hostname: "localhost"
      UNS_historian__database: "uns_historian"
      UNS_historian__table: "unifiednamespace"
      UNS_historian__metrics_table: "uns_metrics"
      UNS_historian__username: "uns_dbuser"
      UNS_historian__password: ${{ needs.generate_random_password.outputs.uns_historian_pwd }}
      POSTGRES_PASSWORD: ${{ needs.generate_random_password.outputs.postgres_pwd }}
    services:
      uns_timescaledb:
        image: "timescale/timescaledb:latest-pg16"
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: ${{ needs.generate_random_password.outputs.postgres_pwd }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup with python environment
        uses: ./.github/include/setup_python/
        with:
          module: 09_uns_model

      - name: Create Database for Integration Testing
        run: |
          echo "CREATE database $UNS_historian__database;
          \c $UNS_historian__database;
          CREATE EXTENSION IF NOT EXISTS timescaledb;

          CREATE ROLE $UNS_historian__username
          LOGIN
          PASSWORD '$UNS_historian__password';

          ALTER DATABASE $UNS_historian__database OWNER TO $UNS_historian__username;
          " | PGPASSWORD=${POSTGRES_PASSWORD} psql -h ${UNS_historian__hostname} -U postgres  -p 5432

          echo "CREATE TABLE $UNS_historian__table (
          time TIMESTAMPTZ NOT NULL,
          topic text NOT NULL,
          client_id text,
          mqtt_msg JSONB,
          CONSTRAINT unique_event UNIQUE (time, topic, client_id, mqtt_msg)
          );

          SELECT create_hypertable('$UNS_historian__table', 'time');
          " | PGPASSWORD=${UNS_historian__password} psql -h ${UNS_historian__hostname} -U $UNS_historian__username -d $UNS_historian__database  -p 5432

          # The enrichment views are built on these hypertables, so they must exist first.
          PGPASSWORD=${UNS_historian__password} psql -h ${UNS_historian__hostname} -U $UNS_historian__username -d $UNS_historian__database -p 5432 -v ON_ERROR_STOP=1 -f 04_uns_historian/sql_scripts/04_setup_metrics_hypertable.sql

      - name: Verify the migration applies and reverses
        # A downgrade that leaves objects behind would make the next upgrade fail, and
        # nobody finds that out until they need to roll back.
        run: |
          cd ./09_uns_model
          uv run uns_model_migrate -v
          uv run uns_model_migrate --downgrade base -v

      - name: Apply the Asset Model migrations and seed
        # The container entrypoint, run against a real Postgres. Leaves the schema
        # migrated and seeded for the integration tests that follow.
        run: |
          cd ./09_uns_model
          uv run uns_model_setup -v

      - name: Run all type of tests
        uses: ./.github/include/execute_tests/
        with:
          module: 09_uns_model
          integration_tests: true
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
          pytest_flags: ${{ inputs.pytest_add_opts }}

  build_docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile and Test Dockerfile
        uses: ./.github/include/test_docker_builds/
        with:
          module: 09_uns_model
          image_name: uns/model
