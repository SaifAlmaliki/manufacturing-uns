# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: UNS MQTT Module

on:
  push:
    branches:
      - "**"
    paths:
      - "02_mqtt-cluster/**/*.py*"
      - "02_mqtt-cluster/pyproject.toml"
      - "02_mqtt-cluster/uv.lock"
      - ".github/workflows/uns_mqtt-app.yml"
      - ".github/include/**"

  pull_request:
    branches:
      - "**"
    paths:
      - "02_mqtt-cluster/**/*.py*"
      - "02_mqtt-cluster/pyproject.toml"
      - "02_mqtt-cluster/uv.lock"
      - ".github/workflows/uns_mqtt-app.yml"
      - ".github/include/**"

  workflow_dispatch:
    inputs:
      pytest_add_opts: # trunk-ignore(checkov/CKV_GHA_7) # trunk-ignore(checkov/CKV_GHA_7)
        description: "additional pytest options"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    services:
      uns_mqtt:
        # Same image as Compose uns_mqtt_broker. GHA services start before checkout,
        # so conf/hivemq/config.xml is not mounted; stock Edge still listens on 1883.
        image: "hivemq/hivemq-edge:latest"
        ports:
          - "1883:1883" # MQTT, unencrypted, unauthenticated
        options: >
          --health-cmd="timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/1883' || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=90s

    steps:
      - uses: actions/checkout@v7

      - name: Setup with python environment
        uses: ./.github/include/setup_python/
        with:
          module: 02_mqtt-cluster

      - name: Run all type of tests
        uses: ./.github/include/execute_tests/
        with:
          module: 02_mqtt-cluster
          integration_tests: true
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
          pytest_flags: ${{ inputs.pytest_add_opts }}
