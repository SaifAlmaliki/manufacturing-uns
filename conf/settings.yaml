# Unified Namespace platform configuration.
# Edit this file and conf/.secrets.yaml for your deployment.
# Override any value with environment variables: export UNS_PLATFORM__INSTANCE_NAME=MyPlant
# Per-module overrides use Dynaconf environments (graphql, graphdb, historian, etc.).

default:
  platform:
    instance_name: "Instance01"
    organization_name: "CovestroAG"
    display_name: "Covestro UNS"

  applications:
    graphql:
      name: "uns_graphql_server"
      port: 8000
    frontend:
      name: "uns_frontend"
      dev_port: 5173
      compose_port: 8088
    graphdb_mapper:
      name: "uns_graphdb_mapper"
    historian_mapper:
      name: "uns_historian_mapper"
    kafka_mapper:
      name: "uns_kafka_mapper"
    sparkplugb_mapper:
      name: "uns_spb_mapper"
    simulator:
      name: "uns_simulator"

  urls:
    graphql_host: "localhost"
    graphql_port: 8000
    graphql_path: "/graphql"
    cors_origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:8088"
      - "http://127.0.0.1:8088"

  mqtt:
    host: "localhost"
    port: 1883
    # Topics are per-environment. Dynaconf merges lists, so a default ["#"]
    # would be prepended to every module override.
    qos: 1
    keep_alive: 60
    reconnect_on_failure: true
    version: 5
    transport: "tcp"
    timestamp_attribute: "timestamp"
    ignored_attributes: {}

  graphdb:
    url: "bolt://localhost:7687"
    # ISA-95 hierarchy (0–4) plus equipment / parameter-type / parameter leaf levels (5–7).
    # Depths beyond index 4 are stored as DEVICE_depth_N in Neo4j; listing them here exposes
    # G1 / ProcessValue / Temperature (etc.) in GraphQL getUnsNodes tree queries.
    uns_node_types:
      - "ENTERPRISE"
      - "FACILITY"
      - "AREA"
      - "LINE"
      - "DEVICE"
      - "DEVICE_depth_1"
      - "DEVICE_depth_2"
      - "DEVICE_depth_3"
    spB_node_types: ["spBv1_0", "GROUP", "MESSAGE_TYPE", "EDGE_NODE", "DEVICE"]
    nested_attribute_node_type: "NESTED_ATTRIBUTE"
    metrics_port: 9092

  historian:
    hostname: "localhost"
    database: "uns_historian"
    table: "unifiednamespace"
    metrics_table: "uns_metrics"
    metrics_port: 9091

  kafka:
    bootstrap_servers: "localhost:9092"

graphql:
  mqtt:
    topics: ["#"]
  kafka:
    config:
      client.id: "uns_graphql_server"
      group.id: "graphql"
      bootstrap.servers: "localhost:9092"
      auto.offset.reset: "earliest"
    consumer_timeout: 0.5

graphdb:
  mqtt:
    topics: ["test/uns/#", "CovestroAG/#", "spBv1.0/uns_group/#"]

historian:
  mqtt:
    topics: ["test/uns/#", "CovestroAG/#", "spBv1.0/#"]

kafka_mapper:
  mqtt:
    topics: ["test/uns/#", "CovestroAG/#"]
  kafka:
    config:
      client.id: "uns_kafka_client"
      bootstrap.servers: "localhost:9092"
      enable.idempotence: true
      retries: 10
      compression.type: "gzip"

sparkplugb:
  mqtt:
    topics: ["spBv1.0/uns_group/#"]

simulator:
  mqtt:
    client_id: "uns_simulator_client"
  hierarchy:
    enterprise: "CovestroAG"
    sites:
      - name: "Dormagen"
        areas:
          - name: "Production"
            lines:
              - name: "Line1"
                cells:
                  - "Cell1"
                  - "Cell2"
              - name: "Line2"
                cells:
                  - "Cell1"
      - name: "Krefeld"
        areas:
          - name: "Production"
            lines:
              - name: "Line1"
                cells:
                  - "Cell1"

  plc:
    - id: "001"
      equipment: "G1"
      sensors:
        Temperature:
          base_value: 75.0
          variation: 2.0
          unit: "°C"
        Pressure:
          base_value: 150.0
          variation: 5.0
          unit: "psi"
    - id: "002"
      equipment: "FillingMachine"
      sensors:
        FlowRate:
          base_value: 450.0
          variation: 20.0
          unit: "L/min"
  simulation:
    interval: 5.0
    duration: 5  # minutes; 0 = run until stopped (Compose sets this to 0)
    plc_count: 2
  equipment:
    mixer_tank:
      name: "MixerTank"
      sensors:
        Temperature:
          base_value: 75.0
          variation: 2.0
          unit: "°C"
        Pressure:
          base_value: 150.0
          variation: 5.0
          unit: "psi"

dynaconf_merge: true
