# Unified Namespace platform configuration.
# Edit this file and conf/.secrets.yaml for your deployment.
# Override any value with environment variables: export UNS_PLATFORM__INSTANCE_NAME=MyPlant
# Per-module overrides use Dynaconf environments (graphql, graphdb, historian, etc.).

default:
  platform:
    instance_name: "Instance01"
    organization_name: "CovestroAG"
    display_name: "Covestro UNS"

  applications:
    graphql:
      name: "uns_graphql_server"
      port: 8000
    frontend:
      name: "uns_frontend"
      dev_port: 5173
      compose_port: 8088
    graphdb_mapper:
      name: "uns_graphdb_mapper"
    historian_mapper:
      name: "uns_historian_mapper"
    kafka_mapper:
      name: "uns_kafka_mapper"
    sparkplugb_mapper:
      name: "uns_spb_mapper"
    simulator:
      name: "uns_simulator"
      # The simulator's own control API (99_simulator/src/uns_simulator/api.py).
      # Not part of the GraphQL surface: it commands a process, it does not query the
      # Unified Namespace. See docs/adr/0007-simulator-control-api-outside-graphql.md.
      api_port: 8099

  urls:
    graphql_host: "localhost"
    graphql_port: 8000
    graphql_path: "/graphql"
    simulator_host: "localhost"
    simulator_port: 8099
    # Vite dev proxies /grafana here. Compose keeps Grafana's 3000 unpublished; nginx on 8088 does.
    grafana_proxy_target: "http://localhost:8088"
    cors_origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:8088"
      - "http://127.0.0.1:8088"

  mqtt:
    host: "localhost"
    port: 1883
    # Topics are per-environment. Dynaconf merges lists, so a default ["#"]
    # would be prepended to every module override.
    qos: 1
    keep_alive: 60
    reconnect_on_failure: true
    version: 5
    transport: "tcp"
    timestamp_attribute: "timestamp"
    ignored_attributes: {}

  graphdb:
    url: "bolt://localhost:7687"
    # ISA-95 hierarchy (0–4) plus equipment / parameter-type / parameter leaf levels (5–7).
    # Depths beyond index 4 are stored as DEVICE_depth_N in Neo4j; listing them here exposes
    # G1 / ProcessValue / Temperature (etc.) in GraphQL getUnsNodes tree queries.
    uns_node_types:
      - "ENTERPRISE"
      - "FACILITY"
      - "AREA"
      - "LINE"
      - "DEVICE"
      - "DEVICE_depth_1"
      - "DEVICE_depth_2"
      - "DEVICE_depth_3"
    spB_node_types: ["spBv1_0", "GROUP", "MESSAGE_TYPE", "EDGE_NODE", "DEVICE"]
    nested_attribute_node_type: "NESTED_ATTRIBUTE"
    metrics_port: 9092

  historian:
    hostname: "localhost"
    database: "uns_historian"
    table: "unifiednamespace"
    metrics_table: "uns_metrics"
    metrics_port: 9091

  opcua:
    client_id: "uns_opcua_client"
    model_check: true
    metrics_port: 9093
    queue_maxsize: 50000
    forward_batch_size: 200
    reconnect_backoff_max_s: 60
    spool:
      path: "/var/lib/uns_opcua/spool.db"
      max_rows: 5000000
      max_bytes: 2000000000
      max_age_hours: 168
      synchronous: "NORMAL"
    # No servers by default: the connector exits cleanly when none are configured,
    # so a stock checkout does not try to reach a PLC that is not there.
    servers: []

  simulator:
    # Prometheus scrapes this. 9091 is the historian's and 9092 the graph database's.
    metrics_port: 9093

  kafka:
    bootstrap_servers: "localhost:9092"

graphql:
  mqtt:
    topics: ["#"]
  kafka:
    config:
      client.id: "uns_graphql_server"
      group.id: "graphql"
      bootstrap.servers: "localhost:9092"
      auto.offset.reset: "earliest"
    consumer_timeout: 0.5

graphdb:
  mqtt:
    topics: ["test/uns/#", "CovestroAG/#", "spBv1.0/uns_group/#"]

historian:
  mqtt:
    topics: ["test/uns/#", "CovestroAG/#", "spBv1.0/#"]

opcua:
  opcua:
    # Replace with the plant's servers. node_id and asset are required; metric_path is
    # optional and appended to the published topic as asset + "/" + metric_path.
    servers: []

kafka_mapper:
  mqtt:
    topics: ["test/uns/#", "CovestroAG/#"]
  kafka:
    config:
      client.id: "uns_kafka_client"
      bootstrap.servers: "localhost:9092"
      enable.idempotence: true
      retries: 10
      compression.type: "gzip"

sparkplugb:
  mqtt:
    topics: ["spBv1.0/uns_group/#"]

simulator:
  mqtt:
    client_id: "uns_simulator_client"
  # Fallback only. conf/simulator/plant.yaml replaces this whole block when it exists, and it
  # does in this repository - so edits here have no effect unless that file is removed. Kept
  # because a deployment with no conf/simulator/ directory still has to have a plant.
  hierarchy:
    enterprise: "CovestroAG"
    sites:
      - name: "Dormagen"
        areas:
          - name: "Production"
            lines:
              - name: "Line1"
                cells:
                  - "Cell1"
                  - "Cell2"
              - name: "Line2"
                cells:
                  - "Cell1"
      - name: "Krefeld"
        areas:
          - name: "Production"
            lines:
              - name: "Line1"
                cells:
                  - "Cell1"

  # The legacy `plc:` list moved to conf/simulator/production.yaml as templates `001` and
  # `002`, unchanged. `simulator.py` still reads this key, so a deployment carrying its own
  # settings.yaml with `plc:` keeps working - but declaring it here as well as in
  # production.yaml would put two publishers on every G1 and FillingMachine topic.
  simulation:
    # Spec 9: `small` is the shipped default because the graphdb mapper MERGEs once per topic
    # level on every message. Switch to `full` for the complete ~55-device plant.
    profile: "small"
    # A fixed seed makes two runs of one profile comparable. Change it to get a different
    # plant with the same shape.
    seed: 20260831
    # Superseded by `tiers` below, which is why it still reads 5.0: spec 12 requires
    # `interval` to be honoured as the `process` tier when no `tiers` block exists, and a
    # deployment that deletes `tiers` should land back on today's behaviour, not on a default.
    interval: 5.0
    duration: 5  # minutes; 0 = run until stopped (Compose sets this to 0)
    # Seconds per cadence tier, before the profile's `tier_scale` multiplies them. `event` is
    # 0.0 meaning "publish on change", and scaling zero keeps it zero - a slow profile must
    # not turn an alarm topic into a slow periodic one.
    tiers:
      fast: 1.0
      process: 5.0
      energy: 15.0
      status: 30.0
      meter: 900.0
      lab: 1800.0
      event: 0.0

oee:
  mqtt:
    client_id: "uns_oee_client"
  oee:
    # Prometheus scrapes this. 9091 historian, 9092 graph database, 9093 simulator,
    # 9094 reserved for the OPC UA edge connector.
    metrics_port: 9095
    # Seconds between scheduler passes. A shift boundary is only ever seen on a pass,
    # so this bounds how late the first revision of a result can be.
    scan_interval_seconds: 300
    # Wait this long after shift_end before computing revision 1, so that in-flight
    # messages have landed in the historian.
    settle_minutes: 15
    # Keep re-checking a shift's input fingerprint for this long after shift_end. Data
    # arriving later than this does not trigger a new revision.
    late_window_hours: 48
    # On an empty results table, walk back this many days. Shifts that end before a
    # unit's earliest historised sample are skipped, not computed as zero.
    backfill_days: 30
    # How far before shift_start the last-known-state query may reach. 72h covers a
    # Friday C into a Monday A on the shipped Mon-Fri roster (weekend gap ~48h).
    prior_lookback_hours: 72

dynaconf_merge: true
