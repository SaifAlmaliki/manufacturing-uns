# Unified Namespace platform configuration.
# Edit this file and conf/.secrets.yaml for your deployment.
# Override any value with environment variables: export UNS_PLATFORM__INSTANCE_NAME=MyPlant
# Per-module overrides use Dynaconf environments (graphql, graphdb, historian, etc.).

default:
  platform:
    instance_name: "Instance01"
    organization_name: "HalabjaWTP"
    display_name: "HalabjaWTP UNS"
    public_origin: "http://localhost:8088"
    # Local/dev keeps HiveMQ XML apply. Production cloud bundle sets this true.
    edge_management:
      cloud_mode: false

  # ISA-95 plant tree. Single source for seed, GraphQL, and the console.
  # Publishers (OPC UA, Modbus, or any connector) are signals on this tree, not
  # a second plant. saveHierarchy writes this block.
  hierarchy:
    enterprise: HalabjaWTP
    sites:
    - name: Halabja
      areas:
      - name: RawWater
        kind: production
        lines:
        - name: Train10
          cells:
          - name: V101
            machines: []
          - name: P101
            machines: []
          - name: P102
            machines: []
          - name: P103
            machines: []
          - name: T101
            machines: []
          - name: FT101
            machines: []
          - name: PT101
            machines: []
      - name: Treatment
        kind: production
        lines:
        - name: Train1
          cells:
          - name: B101
            machines: []
          - name: DP101
            machines: []
          - name: AIT101
            machines: []
      - name: Filtration
        kind: production
        lines:
        - name: Train1
          cells:
          - name: F101
            machines: []
          - name: V201
            machines: []
          - name: V202
            machines: []
      - name: Storage
        kind: production
        lines:
        - name: Train1
          cells:
          - name: T201
            machines: []
      - name: Distribution
        kind: production
        lines:
        - name: Train1
          cells:
          - name: P201111
            machines: []
          - name: P202
            machines:
            - Machine3060
          - name: FT201
            machines:
            - flowmeterX12
          - name: PT201
            machines: []
          - name: V301
            machines: []
    - name: Krabala
      areas:
      - name: RawWater
        kind: production
        lines: []
      - name: Treatment
        kind: production
        lines: []
      - name: Storage
        kind: production
        lines: []
      - name: Distrbution
        kind: production
        lines: []
  applications:
    graphql:
      name: "uns_graphql_server"
      port: 8000
    frontend:
      name: "uns_frontend"
      dev_port: 5173
      compose_port: 8088
    graphdb_mapper:
      name: "uns_graphdb_mapper"
    historian_mapper:
      name: "uns_historian_mapper"
    kafka_mapper:
      name: "uns_kafka_mapper"
    sparkplugb_mapper:
      name: "uns_spb_mapper"
    factory_agent:
      name: "uns_factory_agent"
      port: 8010

  factory_agent:
    model: "gpt-4o"
    graphql_url: "http://localhost:8000/graphql"

  urls:
    graphql_host: "localhost"
    graphql_port: 8000
    graphql_path: "/graphql"
    # Vite dev proxies /grafana here. Compose keeps Grafana's 3000 unpublished; nginx on 8088 does.
    grafana_proxy_target: "http://localhost:8088"
    agent_proxy_target: "http://localhost:8088"
    cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:8088"
    - "http://127.0.0.1:8088"

  auth:
    # The realm is reached through the console's own nginx (/auth), so the issuer is the
    # console's origin and not a second host. That is also what makes Grafana's session
    # cookie same-origin for the three embedded dashboards.
    realm: "uns"
    base_url: "http://localhost:8088/auth"
    issuer: "http://localhost:8088/auth/realms/uns"
    console_client_id: "uns-console"
    grafana_client_id: "uns-grafana"
    # The access token's `aud`, set by the audience mapper in conf/keycloak/realm.json.
    audience: "uns-console"
    # Seconds of tolerance on exp/nbf. A laptop clock is not the realm's clock.
    leeway_seconds: 30
    # Inside the compose network the GraphQL service resolves Keycloak by service name, so
    # its JWKS fetch does not depend on the frontend container being up.
    internal_base_url: "http://uns_keycloak:8080"

  mqtt:
    host: "localhost"
    port: 1883
    public_host: "localhost"
    public_port: 1883
    # Topics are per-environment. Dynaconf merges lists, so a default ["#"]
    # would be prepended to every module override.
    qos: 1
    keep_alive: 60
    reconnect_on_failure: true
    version: 5
    transport: "tcp"
    timestamp_attribute: "timestamp"
    ignored_attributes: {}

  hivemq_edge:
    base_url: "http://127.0.0.1:18080"
    username: admin
    password: hivemq

  graphdb:
    url: "bolt://localhost:7687"
    # ISA-95 hierarchy (0–4) plus equipment / parameter-type / parameter leaf levels (5–7).
    # Depths beyond index 4 are stored as DEVICE_depth_N in Neo4j; listing them here exposes
    # G1 / ProcessValue / Temperature (etc.) in GraphQL getUnsNodes tree queries.
    uns_node_types:
    - "ENTERPRISE"
    - "FACILITY"
    - "AREA"
    - "LINE"
    - "DEVICE"
    - "DEVICE_depth_1"
    - "DEVICE_depth_2"
    - "DEVICE_depth_3"
    spB_node_types: ["spBv1_0", "GROUP", "MESSAGE_TYPE", "EDGE_NODE", "DEVICE"]
    nested_attribute_node_type: "NESTED_ATTRIBUTE"
    metrics_port: 9092

  historian:
    hostname: "localhost"
    database: "uns_historian"
    table: "unifiednamespace"
    metrics_table: "uns_metrics"
    metrics_port: 9091
    pipeline_epoch: 1
    historic_kafka_topic: "uns.historic-events"
    batch:
      max_events: 500
      max_bytes: 4194304
      max_age_seconds: 0.1
      max_metric_rows: 20000
    consumer_poll_timeout: 0.2
    aggregate_refresh_interval_seconds: 30
    aggregate_refresh_min_interval_seconds: 5
    kafka:
      config:
        client.id: "uns_historian"
        bootstrap.servers: "localhost:9092"

  opcua:
    client_id: "uns_opcua_client"
    model_check: true
    metrics_port: 9093
    queue_maxsize: 50000
    forward_batch_size: 200
    reconnect_backoff_max_s: 60
    spool:
      path: "/var/lib/uns_opcua/spool.db"
      max_rows: 5000000
      max_bytes: 2000000000
      max_age_hours: 168
      synchronous: "NORMAL"
    # No servers by default: the connector exits cleanly when none are configured,
    # so a stock checkout does not try to reach a PLC that is not there.
    servers: []

  kafka:
    bootstrap_servers: "localhost:9092"

  kafka_bootstrap:
    pipeline_epoch: 1
    config:
      bootstrap.servers: "localhost:9092"
    historic_topic:
      name: uns.historic-events
      partitions: 12
      replication_factor: 1
      retention_ms: 604800000
    dlq_topic:
      name: uns.historic-events.dlq
      partitions: 12
      replication_factor: 1
      retention_ms: 2592000000

  datalake:
    backend: s3
    metrics_port: 9096
    consumer_poll_timeout: 0.2
    kafka:
      topic: uns.historic-events
      group_id: uns_datalake
      initial_position: require_committed
      config:
        client.id: uns_datalake
        bootstrap.servers: localhost:9092
    flush:
      interval_seconds: 60
      max_bytes: 8388608
      max_records: 10000
      max_record_bytes: 1048576
      worker_max_buffered_bytes: 33554432
      max_active_route_groups: 64
      max_encoded_bytes: 16777216
    s3:
      bucket: uns-historic-events
      region: us-east-1
      endpoint_url: http://uns-minio:9000
    adls:
      account: ""
      container: ""

graphql:
  publication_api:
    trusted_proxy_value: "1"
    global_queue_budget_bytes: 1073741824
    principal_queue_budget_bytes: 134217728
    http_routes:
      - route_id: halabja-lims-results
        mqtt_topic: HalabjaWTP/Halabja/LIMS/results
        principal_id: halabja-lims-publisher
        topic_filter: HalabjaWTP/Halabja/LIMS/results
        source_id: halabja/lims-01
        source_application: lims
        site_id: halabja
        wire_format: uns-publication-v1
        content_type: application/json
        event_kind: business_event
        archive_eligible: true
        allowed_schema_pairs:
          - payload_schema_id: lab-result
            payload_schema_version: "1"
      - route_id: halabja-sap-material-documents
        mqtt_topic: HalabjaWTP/Halabja/SAP/material-documents
        principal_id: halabja-sap-publisher
        topic_filter: HalabjaWTP/Halabja/SAP/material-documents
        source_id: halabja/sap-erp-01
        source_application: sap
        site_id: halabja
        wire_format: uns-publication-v1
        content_type: application/json
        event_kind: business_event
        archive_eligible: true
        allowed_schema_pairs:
          - payload_schema_id: material-document
            payload_schema_version: "1"
  mqtt:
    topics: ["#"]
  kafka:
    config:
      client.id: "uns_graphql_server"
      group.id: "graphql"
      bootstrap.servers: "localhost:9092"
      auto.offset.reset: "earliest"
    consumer_timeout: 0.5
  event_stream:
    historic_topic: "uns.historic-events"
    broadcast_group_prefix: "uns_graphql_live"
    max_clients: 200
    max_topics_per_subscription: 100
    max_client_messages: 100
    max_client_bytes: 1048576
    consumer_poll_timeout: 0.2

graphdb:
  mqtt:
    # The broker is the Unified Namespace. Persist every plant topic; drop
    # uns/platform/... in uns_config.is_historic_event_topic (ADR-0007).
    topics: ["#"]

historian:
  mqtt:
    # Same ingest policy as graphdb and kafka_mapper — one Unified Namespace.
    topics: ["#"]
  kafka:
    config:
      client.id: "uns_historian"
      bootstrap.servers: "localhost:9092"

datalake:
  backend: s3
  metrics_port: 9096
  consumer_poll_timeout: 0.2
  kafka:
    topic: uns.historic-events
    group_id: uns_datalake
    initial_position: require_committed
    config:
      client.id: uns_datalake
      bootstrap.servers: localhost:9092
  flush:
    interval_seconds: 60
    max_bytes: 8388608
    max_records: 10000
    max_record_bytes: 1048576
    worker_max_buffered_bytes: 33554432
    max_active_route_groups: 64
    max_encoded_bytes: 16777216
  s3:
    bucket: uns-historic-events
    region: us-east-1
    endpoint_url: http://uns-minio:9000
  adls:
    account: ""
    container: ""

opcua:
  opcua:
    # Replace with the plant's servers. node_id and asset are required; metric_path is
    # optional and appended to the published topic as asset + "/" + metric_path.
    servers: []

kafka_mapper:
  mqtt:
    topics: ["#"]
    client_id: "uns_kafka_ingest-dev"
  ingestion:
    shard_id: "dev"
    client_id: "uns_kafka_ingest-dev"
    # Enabled in shipped config: historian and GraphQL readers are v2-compatible (ADR-0012).
    # Set false only when rolling back or upgrading readers before writers on an existing deployment.
    v2_publications_enabled: true
    ownership:
      - site_id: "default"
        source_id: "default/ingress"
        topic_prefix: ""
    publication_routes:
      - topic_filter: "HalabjaWTP/Halabja/Distribution/+/+/Value"
        source_id: "halabja/distribution-machine"
        source_application: machine
        site_id: halabja
        wire_format: raw
        content_type: application/json
        event_kind: telemetry
        archive_eligible: true
        default_schema_pair:
          payload_schema_id: machine-temperature
          payload_schema_version: "1"
        allowed_schema_pairs:
          - payload_schema_id: machine-temperature
            payload_schema_version: "1"
      - topic_filter: "HalabjaWTP/Halabja/LIMS/results"
        source_id: "halabja/lims-01"
        source_application: lims
        site_id: halabja
        wire_format: uns-publication-v1
        content_type: application/json
        event_kind: business_event
        archive_eligible: true
        allowed_schema_pairs:
          - payload_schema_id: lab-result
            payload_schema_version: "1"
      - topic_filter: "HalabjaWTP/Halabja/MES/orders"
        source_id: "halabja/mes-01"
        source_application: mes
        site_id: halabja
        wire_format: raw
        content_type: application/json
        event_kind: business_event
        archive_eligible: true
        default_schema_pair:
          payload_schema_id: production-order
          payload_schema_version: "1"
        allowed_schema_pairs:
          - payload_schema_id: production-order
            payload_schema_version: "1"
      - topic_filter: "HalabjaWTP/Halabja/Logistics/movements"
        source_id: "halabja/logistics-01"
        source_application: logistics
        site_id: halabja
        wire_format: uns-publication-v1
        content_type: application/json
        event_kind: business_event
        archive_eligible: true
        allowed_schema_pairs:
          - payload_schema_id: inventory-movement
            payload_schema_version: "1"
      - topic_filter: "HalabjaWTP/Halabja/SAP/material-documents"
        source_id: "halabja/sap-erp-01"
        source_application: sap
        site_id: halabja
        wire_format: uns-publication-v1
        content_type: application/json
        event_kind: business_event
        archive_eligible: true
        allowed_schema_pairs:
          - payload_schema_id: material-document
            payload_schema_version: "1"
  metrics_port: 9094
  kafka:
    config:
      client.id: "uns_kafka_client"
      bootstrap.servers: "localhost:9092"
      enable.idempotence: true
      retries: 10
      compression.type: "gzip"

sparkplugb:
  mqtt:
    topics: ["spBv1.0/uns_group/#"]

oee:
  mqtt:
    client_id: "uns_oee_client"
  oee:
    # Prometheus scrapes this. 9091 historian, 9092 graph database,
    # 9093 OPC UA edge connector.
    metrics_port: 9095
    # Seconds between scheduler passes. A shift boundary is only ever seen on a pass,
    # so this bounds how late the first revision of a result can be.
    scan_interval_seconds: 300
    # Wait this long after shift_end before computing revision 1, so that in-flight
    # messages have landed in the historian.
    settle_minutes: 15
    # Keep re-checking a shift's input fingerprint for this long after shift_end. Data
    # arriving later than this does not trigger a new revision.
    late_window_hours: 48
    # On an empty results table, walk back this many days. Shifts that end before a
    # unit's earliest historised sample are skipped, not computed as zero.
    backfill_days: 30
    # How far before shift_start the last-known-state query may reach. 72h covers a
    # Friday C into a Monday A on the shipped Mon-Fri roster (weekend gap ~48h).
    prior_lookback_hours: 72

dynaconf_merge: true
