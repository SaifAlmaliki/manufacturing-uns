# Unified Namespace platform configuration.
# Edit this file and conf/.secrets.yaml for your deployment.
# Override any value with environment variables: export UNS_PLATFORM__INSTANCE_NAME=MyPlant
# Per-module overrides use Dynaconf environments (graphql, graphdb, historian, etc.).

default:
  platform:
    instance_name: "Instance01"
    organization_name: "HalabjaWTP"
    display_name: "HalabjaWTP UNS"

  # ISA-95 plant tree. Single source for seed, GraphQL, and the console.
  # Publishers (OPC UA, Modbus, or any connector) are signals on this tree, not
  # a second plant. saveHierarchy writes this block.
  hierarchy:
    enterprise: HalabjaWTP
    sites:
    - name: Halabja
      areas:
      - name: RawWater
        kind: production
        lines:
        - name: Train10
          cells:
          - name: V101
            machines: []
          - name: P101
            machines: []
          - name: P102
            machines: []
          - name: P103
            machines: []
          - name: T101
            machines: []
          - name: FT101
            machines: []
          - name: PT101
            machines: []
      - name: Treatment
        kind: production
        lines:
        - name: Train1
          cells:
          - name: B101
            machines: []
          - name: DP101
            machines: []
          - name: AIT101
            machines: []
      - name: Filtration
        kind: production
        lines:
        - name: Train1
          cells:
          - name: F101
            machines: []
          - name: V201
            machines: []
          - name: V202
            machines: []
      - name: Storage
        kind: production
        lines:
        - name: Train1
          cells:
          - name: T201
            machines: []
      - name: Distribution
        kind: production
        lines:
        - name: Train1
          cells:
          - name: P201111
            machines: []
          - name: P202
            machines:
            - Machine3060
          - name: FT201
            machines:
            - flowmeterX12
          - name: PT201
            machines: []
          - name: V301
            machines: []
  applications:
    graphql:
      name: "uns_graphql_server"
      port: 8000
    frontend:
      name: "uns_frontend"
      dev_port: 5173
      compose_port: 8088
    graphdb_mapper:
      name: "uns_graphdb_mapper"
    historian_mapper:
      name: "uns_historian_mapper"
    kafka_mapper:
      name: "uns_kafka_mapper"
    sparkplugb_mapper:
      name: "uns_spb_mapper"

  urls:
    graphql_host: "localhost"
    graphql_port: 8000
    graphql_path: "/graphql"
    # Vite dev proxies /grafana here. Compose keeps Grafana's 3000 unpublished; nginx on 8088 does.
    grafana_proxy_target: "http://localhost:8088"
    cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:8088"
    - "http://127.0.0.1:8088"

  auth:
    # The realm is reached through the console's own nginx (/auth), so the issuer is the
    # console's origin and not a second host. That is also what makes Grafana's session
    # cookie same-origin for the three embedded dashboards.
    realm: "uns"
    base_url: "http://localhost:8088/auth"
    issuer: "http://localhost:8088/auth/realms/uns"
    console_client_id: "uns-console"
    grafana_client_id: "uns-grafana"
    # The access token's `aud`, set by the audience mapper in conf/keycloak/realm.json.
    audience: "uns-console"
    # Seconds of tolerance on exp/nbf. A laptop clock is not the realm's clock.
    leeway_seconds: 30
    # Inside the compose network the GraphQL service resolves Keycloak by service name, so
    # its JWKS fetch does not depend on the frontend container being up.
    internal_base_url: "http://uns_keycloak:8080"

  mqtt:
    host: "localhost"
    port: 1883
    # Topics are per-environment. Dynaconf merges lists, so a default ["#"]
    # would be prepended to every module override.
    qos: 1
    keep_alive: 60
    reconnect_on_failure: true
    version: 5
    transport: "tcp"
    timestamp_attribute: "timestamp"
    ignored_attributes: {}

  graphdb:
    url: "bolt://localhost:7687"
    # ISA-95 hierarchy (0–4) plus equipment / parameter-type / parameter leaf levels (5–7).
    # Depths beyond index 4 are stored as DEVICE_depth_N in Neo4j; listing them here exposes
    # G1 / ProcessValue / Temperature (etc.) in GraphQL getUnsNodes tree queries.
    uns_node_types:
    - "ENTERPRISE"
    - "FACILITY"
    - "AREA"
    - "LINE"
    - "DEVICE"
    - "DEVICE_depth_1"
    - "DEVICE_depth_2"
    - "DEVICE_depth_3"
    spB_node_types: ["spBv1_0", "GROUP", "MESSAGE_TYPE", "EDGE_NODE", "DEVICE"]
    nested_attribute_node_type: "NESTED_ATTRIBUTE"
    metrics_port: 9092

  historian:
    hostname: "localhost"
    database: "uns_historian"
    table: "unifiednamespace"
    metrics_table: "uns_metrics"
    metrics_port: 9091

  opcua:
    client_id: "uns_opcua_client"
    model_check: true
    metrics_port: 9093
    queue_maxsize: 50000
    forward_batch_size: 200
    reconnect_backoff_max_s: 60
    spool:
      path: "/var/lib/uns_opcua/spool.db"
      max_rows: 5000000
      max_bytes: 2000000000
      max_age_hours: 168
      synchronous: "NORMAL"
    # No servers by default: the connector exits cleanly when none are configured,
    # so a stock checkout does not try to reach a PLC that is not there.
    servers: []

  kafka:
    bootstrap_servers: "localhost:9092"

graphql:
  mqtt:
    topics: ["#"]
  kafka:
    config:
      client.id: "uns_graphql_server"
      group.id: "graphql"
      bootstrap.servers: "localhost:9092"
      auto.offset.reset: "earliest"
    consumer_timeout: 0.5

graphdb:
  mqtt:
    topics: [test/uns/#, HalabjaWTP/#, spBv1.0/uns_group/#]

historian:
  mqtt:
    topics: [test/uns/#, HalabjaWTP/#, spBv1.0/#]

opcua:
  opcua:
    # Replace with the plant's servers. node_id and asset are required; metric_path is
    # optional and appended to the published topic as asset + "/" + metric_path.
    servers: []

kafka_mapper:
  mqtt:
    topics: [test/uns/#, HalabjaWTP/#]
  kafka:
    config:
      client.id: "uns_kafka_client"
      bootstrap.servers: "localhost:9092"
      enable.idempotence: true
      retries: 10
      compression.type: "gzip"

sparkplugb:
  mqtt:
    topics: ["spBv1.0/uns_group/#"]

oee:
  mqtt:
    client_id: "uns_oee_client"
  oee:
    # Prometheus scrapes this. 9091 historian, 9092 graph database,
    # 9093 OPC UA edge connector.
    metrics_port: 9095
    # Seconds between scheduler passes. A shift boundary is only ever seen on a pass,
    # so this bounds how late the first revision of a result can be.
    scan_interval_seconds: 300
    # Wait this long after shift_end before computing revision 1, so that in-flight
    # messages have landed in the historian.
    settle_minutes: 15
    # Keep re-checking a shift's input fingerprint for this long after shift_end. Data
    # arriving later than this does not trigger a new revision.
    late_window_hours: 48
    # On an empty results table, walk back this many days. Shifts that end before a
    # unit's earliest historised sample are skipped, not computed as zero.
    backfill_days: 30
    # How far before shift_start the last-known-state query may reach. 72h covers a
    # Friday C into a Monday A on the shipped Mon-Fri roster (weekend gap ~48h).
    prior_lookback_hours: 72

dynaconf_merge: true
