default:
  mqtt:
    username: "#<enter the username for the mqtt broker>"
    password: "#<enter the password for the mqtt broker>"
    tls:
      #ca_certs:
      #certfile:
      #keyfile:
      #cert_reqs:
      #ciphers:
      #keyfile_password:
      #insecure_cert: true

  graphdb:
    username: "#<enter the username for the graph database>"
    password: "#<enter the password for the graph database>"

  historian:
    username: "#<enter the username for the Timescale database>"
    password: "#<enter the password for the Timescale database>"
    sslmode:
    sslcert:
    sslkey:
    sslrootcert:
    sslcrl:

  # Superuser for the Timescale/Postgres image. Docker Compose uses this as
  # POSTGRES_PASSWORD / PGPASSWORD to create the volume and the uns_dbuser role.
  # Python services never connect as this user — they use historian.* above.
  postgres:
    password: "#<enter the postgres superuser password>"

  simulator:
    api:
      # Optional. Leave unset for an open control API, which is the default and is
      # appropriate for the local Docker Compose stack. Set it and every request to
      # http://<host>:8099/simulator/* must carry X-Simulator-Token with this value.
      token:

  kafka:
    config:
      security.protocol: "SASL_SSL"
      sasl.mechanisms: "SCRAM-SHA-256"
      sasl.username: ""
      sasl.password: ""
      ssl.cipher.suites: ""
      ssl.curves.list: ""
      ssl.sigalgs.list: ""
      ssl.key.location: ""
      ssl.key.password: ""
      ssl.key.pem: ""

  keycloak:
    # Keycloak's own bootstrap admin, for the admin console at /auth/admin/.
    admin_password: "#<Enter the Keycloak admin password>"
    # Must match the uns-grafana client secret Keycloak imports from conf/keycloak/realm.json.
    grafana_client_secret: "#<Enter the Grafana OIDC client secret>"

dynaconf_merge: true
