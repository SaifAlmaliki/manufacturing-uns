    signals:
      PV: {shape: derived, expr: ctx.wtp.b101.pv_m, unit: "m", precision: 2, tier: process, param_type: ProcessValue}
      LevelPct: {shape: derived, expr: ctx.wtp.b101.level_pct, unit: "%", precision: 1, tier: process, param_type: ProcessValue}

  - id: DP101
