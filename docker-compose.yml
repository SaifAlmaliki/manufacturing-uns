# This is a docker-compose to rapidly deploy all uns modules and  associated  services needed for deployment
# DO NOT USE FOR PRODUCTION DEPLOYMENT
# Services mount the repository-root conf/ directory at /app/conf.
# Override hosts and database passwords with UNS_* environment variables while running this compose file.
# Env Variables which have to be set are
#   - UNS_graphdb__password
#   - UNS_historian__password
#   - PGPASSWORD

# Example for running this would be
#   UNS_graphdb__password=password1 UNS_historian__password=password2 PGPASSWORD=password3 docker-compose up -d
# Example for destroying  all the containers and volumes created
#   UNS_graphdb__password=<password1> UNS_historian__password=<password1> PGPASSWORD=<password3> docker-compose down --volumes
services:
  uns_mqtt_broker:
    image: "emqx/emqx:latest"
    ports:
      # MQTT Ports
      - "1883:1883" # MQTT, unencrypted, unauthenticated
      - "1884:1884" # MQTT, unencrypted, authenticated
      # WebSocket Ports
      - "8080:8080" # MQTT over WebSockets, unencrypted, unauthenticated
      - "8090:8090" # MQTT over WebSockets, unencrypted, authenticated
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 25s
      retries: 12
      start_period: 40s

  uns_timescale_db:
    image: "timescale/timescaledb:latest-pg16"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD}
    healthcheck:
      test: "pg_isready --username=postgres && psql --username=postgres --list"
      timeout: 10s
      retries: 20

  uns_neo4j_db:
    image: "neo4j:latest"
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${UNS_graphdb__password}
      apoc.export.file.enabled: "true"
      apoc.import.file.enabled: "true"
      apoc.import.file.use_neo4j_config: "true"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

  uns_kafka_broker:
    image: "apache/kafka:latest"
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://uns_kafka_broker:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@uns_kafka_broker:29093"
      KAFKA_LISTENERS: "PLAINTEXT://uns_kafka_broker:29092,CONTROLLER://uns_kafka_broker:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "L6kX4b2SR9O-3p8k0b5V7w" # Generated using "kafka-storage.sh random-uuid"
    healthcheck:
      test: "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"
      start_period: 40s
      interval: 5s
      timeout: 10s
      retries: 8

  tsdb_setup_script:
    image: "postgres:12"
    volumes:
      - ./04_uns_historian/sql_scripts:/sql:ro
    environment:
      PGPASSWORD: ${PGPASSWORD}
      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__table: "unifiednamespace"
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
    depends_on:
      uns_timescale_db:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        PGPASSWORD=$${PGPASSWORD} psql -h $${UNS_historian__hostname} -U postgres -p 5432 -c "CREATE DATABASE $${UNS_historian__database};"
        PGPASSWORD=$${PGPASSWORD} psql -h $${UNS_historian__hostname} -U postgres -p 5432 -d $${UNS_historian__database} -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"
        PGPASSWORD=$${PGPASSWORD} psql -h $${UNS_historian__hostname} -U postgres -p 5432 -c "CREATE ROLE $${UNS_historian__username} LOGIN PASSWORD '$${UNS_historian__password}';"
        PGPASSWORD=$${PGPASSWORD} psql -h $${UNS_historian__hostname} -U postgres -p 5432 -c "ALTER DATABASE $${UNS_historian__database} OWNER TO $${UNS_historian__username};"
        PGPASSWORD=$${UNS_historian__password} psql -h $${UNS_historian__hostname} -U $${UNS_historian__username} -d $${UNS_historian__database} -p 5432 -c "CREATE TABLE $${UNS_historian__table} (time TIMESTAMPTZ NOT NULL, topic TEXT NOT NULL, client_id TEXT, mqtt_msg JSONB, CONSTRAINT unique_event UNIQUE (time, topic, client_id, mqtt_msg));"
        PGPASSWORD=$${UNS_historian__password} psql -h $${UNS_historian__hostname} -U $${UNS_historian__username} -d $${UNS_historian__database} -p 5432 -c "SELECT create_hypertable('$${UNS_historian__table}', 'time');"
        PGPASSWORD=$${UNS_historian__password} psql -h $${UNS_historian__hostname} -U $${UNS_historian__username} -d $${UNS_historian__database} -p 5432 -v ON_ERROR_STOP=1 -f /sql/04_setup_metrics_hypertable.sql
        echo "Successfully created & configured timescaledb for the UNS"

  # Creates the `model` and `console` schemas and the enrichment views, then imports
  # the configured plant hierarchy as Assets. Runs after tsdb_setup_script because the
  # enrichment views are only created once their hypertables exist. Exits when done, so
  # dependents wait on service_completed_successfully rather than a healthcheck.
  asset_model_setup:
    build:
      context: .
      dockerfile: ./09_uns_model/Dockerfile
    volumes:
      - ./conf:/app/conf
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 09_uns_model
      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__table: "unifiednamespace"
      UNS_historian__metrics_table: "uns_metrics"
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
    depends_on:
      uns_timescale_db:
        condition: service_healthy
      tsdb_setup_script:
        condition: service_completed_successfully

  graphdb_client:
    build:
      context: .
      dockerfile: ./03_uns_graphdb/Dockerfile
    volumes:
      - ./conf:/app/conf
    ports:
      - "9092:9092"
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 03_uns_graphdb
      UNS_mqtt__host: uns_mqtt_broker
      UNS_graphdb__url: "bolt://uns_neo4j_db:7687"
      UNS_graphdb__username: neo4j
      UNS_graphdb__password: ${UNS_graphdb__password}
      UNS_graphdb__metrics_port: 9092
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_neo4j_db:
        condition: service_healthy

  historian_client:
    build:
      context: .
      dockerfile: ./04_uns_historian/Dockerfile
    volumes:
      - ./conf:/app/conf
    ports:
      - "9091:9091"
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 04_uns_historian
      UNS_mqtt__host: uns_mqtt_broker
      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__table: "unifiednamespace"
      UNS_historian__metrics_table: "uns_metrics"
      UNS_historian__metrics_port: 9091
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_timescale_db:
        condition: service_healthy
      tsdb_setup_script:
        condition: service_completed_successfully
      asset_model_setup:
        condition: service_completed_successfully

  # Read-only OPC UA edge connector. Started with the default compose stack (no
  # profiles; prometheus depends_on it). With no opcua.servers configured it logs
  # that there is nothing to collect, stays up serving /metrics on 9093, and does
  # not connect to a PLC.
  opcua_client:
    build:
      context: .
      dockerfile: ./10_uns_opcua/Dockerfile
    volumes:
      - ./conf:/app/conf
      # The spool must outlive the container - that is the whole point of it.
      - opcua_spool:/var/lib/uns_opcua
    ports:
      - "9093:9093"
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 10_uns_opcua
      UNS_mqtt__host: uns_mqtt_broker
      UNS_opcua__metrics_port: 9093
      # The Asset Model shares the historian's database, so model_check reads these.
      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy

  spb_mapper_client:
    build:
      context: .
      dockerfile: ./05_sparkplugb/Dockerfile
    volumes:
      - ./conf:/app/conf
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 05_sparkplugb
      UNS_mqtt__host: uns_mqtt_broker
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy

  kafka_mapper_client:
    build:
      context: .
      dockerfile: ./06_uns_kafka/Dockerfile
    volumes:
      - ./conf:/app/conf
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 06_uns_kafka
      UNS_mqtt__host: uns_mqtt_broker
      UNS_kafka__config: '@json {"client.id": "uns_kafka_client", "bootstrap.servers": "uns_kafka_broker:9092", "enable.idempotence": true, "retries": 10, "compression.type": "gzip"}'
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_kafka_broker:
        condition: service_healthy

  # Computes OEE for closed shifts and publishes each result to `<line>/KPI/ShiftOee`.
  # Reads the `uns_metrics` hypertable and writes the `oee` schema; it never publishes
  # process data and never writes to a control system (ADR-0008).
  oee_client:
    build:
      context: .
      dockerfile: ./12_uns_oee/Dockerfile
    volumes:
      - ./conf:/app/conf
    # 9095 stays unpublished: Prometheus scrapes it from inside the network, exactly as it
    # does the historian's 9091, the graph database's 9092 and the simulator's 9093.
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 12_uns_oee
      UNS_mqtt__host: uns_mqtt_broker
      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__metrics_table: "uns_metrics"
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
      UNS_oee__metrics_port: 9095
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_timescale_db:
        condition: service_healthy
      tsdb_setup_script:
        condition: service_completed_successfully
      # Creates the `oee` schema and imports conf/oee/*.yaml. Without it the first pass
      # finds no OeeUnit rows and does nothing, which is silent.
      asset_model_setup:
        condition: service_completed_successfully

  uns_simulator:
    build:
      context: .
      dockerfile: ./99_simulator/Dockerfile
    # Uncomment to reach the control API from the host — needed for `npm run dev` against a
    # composed stack, and for the curl checks in the plan's Manual Verification.
    #
    # Commented out by default because the API has no user identity: anyone who can reach
    # 8099 can stop the simulator, switch its profile, or disable a device (spec 10). Inside
    # the compose network `uns_frontend`'s nginx reaches it by service name and no host port
    # is needed, so publishing it by default would widen the reachable surface for nothing.
    #
    # 9093 stays unpublished either way: Prometheus scrapes it from inside the network,
    # exactly as it does the historian's 9091 and the graph database's 9092.
    # ports:
    #   - "8099:8099"
    volumes:
      - ./conf:/app/conf
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 99_simulator
      UNS_mqtt__host: uns_mqtt_broker
      UNS_simulation__duration: "0"
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy

  graphql_server:
    build:
      context: .
      dockerfile: ./07_uns_graphql/Dockerfile
    volumes:
      - ./conf:/app/conf
    ports:
      - "8000:8000"
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 07_uns_graphql
      UNS_mqtt__host: uns_mqtt_broker

      UNS_graphdb__url: "bolt://uns_neo4j_db:7687"
      UNS_graphdb__username: neo4j
      UNS_graphdb__password: ${UNS_graphdb__password}

      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__table: "unifiednamespace"
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
      UNS_kafka__config: '@json {"client.id": "uns_graphql_server", "group.id": "graphql", "bootstrap.servers": "uns_kafka_broker:29092", "auto.offset.reset": "earliest"}'
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_neo4j_db:
        condition: service_healthy
      uns_timescale_db:
        condition: service_healthy
      tsdb_setup_script:
        condition: service_completed_successfully
      asset_model_setup:
        condition: service_completed_successfully
      uns_kafka_broker:
        condition: service_healthy

  uns_frontend:
    build:
      context: .
      dockerfile: ./11_frontend/Dockerfile
      args:
        VITE_GRAPHQL_URL: /graphql
    ports:
      - "8088:80"
    depends_on:
      - graphql_server
      # nginx.conf proxies /simulator to it, and nginx will not start on an unresolvable
      # upstream hostname.
      - uns_simulator

  uns_prometheus:
    image: "prom/prometheus:latest"
    ports:
      - "9090:9090"
    volumes:
      - ./08_uns_observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - historian_client
      - graphdb_client
      - uns_simulator
      - opcua_client
      - oee_client

  uns_grafana:
    image: "grafana/grafana:latest"
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_INSTALL_PLUGINS: grafana-mqtt-datasource
      UNS_HISTORIAN_PASSWORD: ${UNS_historian__password}
    volumes:
      - ./08_uns_observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./08_uns_observability/grafana/provisioning/datasources/datasources.yaml.template:/etc/grafana/provisioning/datasources/datasources.yaml.template:ro
      - ./08_uns_observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./08_uns_observability/grafana/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_timescale_db:
        condition: service_healthy
      tsdb_setup_script:
        condition: service_completed_successfully
      # Dashboards read the enriched views, which this service creates.
      asset_model_setup:
        condition: service_completed_successfully
      uns_prometheus:
        condition: service_started
      # The OEE dashboard's panels read the `oee` schema. `asset_model_setup` creates it,
      # so this is not about the tables existing - it is so that a stack brought up for a
      # demo has the engine running before anybody opens the dashboard.
      oee_client:
        condition: service_started

volumes:
  opcua_spool:
