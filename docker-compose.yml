# This is a docker-compose to rapidly deploy all uns modules and  associated  services needed for deployment
# DO NOT USE FOR PRODUCTION DEPLOYMENT
# Services mount the repository-root conf/ directory at /app/conf.
# Passwords come from conf/.secrets.yaml (graphdb.password, historian.password,
# postgres.password). Compose cannot read YAML, so start with:
#   uv run uns_compose up -d --build
# That loads the secrets file and runs `docker compose` with the same interpolations
# this file still uses (${UNS_graphdb__password}, ${UNS_historian__password}, ${PGPASSWORD}).
# Do not keep a second root .env for credentials.
services:
  uns_mqtt_broker:
    image: "hivemq/hivemq-edge:latest"
    ports:
      - "1883:1883" # MQTT, unencrypted, unauthenticated
      - "18080:8080" # HiveMQ Edge console / API. Not MQTT-WS.
    volumes:
      - ./conf/hivemq/config.xml:/opt/hivemq/conf/config.xml:ro
    # Healthy = MQTT TCP is accepting connections, not "every PLC is up".
    # /dev/tcp is bash; the official image is Debian-based.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/1883' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s

  uns_timescale_db:
    image: "timescale/timescaledb:latest-pg16"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD}
    healthcheck:
      test: "pg_isready --username=postgres && psql --username=postgres --list"
      timeout: 10s
      retries: 20

  uns_neo4j_db:
    image: "neo4j:latest"
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${UNS_graphdb__password}
      apoc.export.file.enabled: "true"
      apoc.import.file.enabled: "true"
      apoc.import.file.use_neo4j_config: "true"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

  uns_kafka_broker:
    image: "apache/kafka:latest"
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://uns_kafka_broker:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@uns_kafka_broker:29093"
      KAFKA_LISTENERS: "PLAINTEXT://uns_kafka_broker:29092,CONTROLLER://uns_kafka_broker:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "L6kX4b2SR9O-3p8k0b5V7w" # Generated using "kafka-storage.sh random-uuid"
    healthcheck:
      test: "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"
      start_period: 40s
      interval: 5s
      timeout: 10s
      retries: 8

  tsdb_setup_script:
    image: "postgres:12"
    volumes:
      - ./04_uns_historian/sql_scripts:/sql:ro
    environment:
      PGPASSWORD: ${PGPASSWORD}
      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__table: "unifiednamespace"
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
    depends_on:
      uns_timescale_db:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        PGPASSWORD=$${PGPASSWORD} psql -h $${UNS_historian__hostname} -U postgres -p 5432 -c "CREATE DATABASE $${UNS_historian__database};"
        PGPASSWORD=$${PGPASSWORD} psql -h $${UNS_historian__hostname} -U postgres -p 5432 -d $${UNS_historian__database} -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"
        PGPASSWORD=$${PGPASSWORD} psql -h $${UNS_historian__hostname} -U postgres -p 5432 -c "CREATE ROLE $${UNS_historian__username} LOGIN PASSWORD '$${UNS_historian__password}';"
        PGPASSWORD=$${PGPASSWORD} psql -h $${UNS_historian__hostname} -U postgres -p 5432 -c "ALTER DATABASE $${UNS_historian__database} OWNER TO $${UNS_historian__username};"
        PGPASSWORD=$${UNS_historian__password} psql -h $${UNS_historian__hostname} -U $${UNS_historian__username} -d $${UNS_historian__database} -p 5432 -c "CREATE TABLE $${UNS_historian__table} (time TIMESTAMPTZ NOT NULL, topic TEXT NOT NULL, client_id TEXT, mqtt_msg JSONB, CONSTRAINT unique_event UNIQUE (time, topic, client_id, mqtt_msg));"
        PGPASSWORD=$${UNS_historian__password} psql -h $${UNS_historian__hostname} -U $${UNS_historian__username} -d $${UNS_historian__database} -p 5432 -c "SELECT create_hypertable('$${UNS_historian__table}', 'time');"
        PGPASSWORD=$${UNS_historian__password} psql -h $${UNS_historian__hostname} -U $${UNS_historian__username} -d $${UNS_historian__database} -p 5432 -v ON_ERROR_STOP=1 -f /sql/04_setup_metrics_hypertable.sql
        echo "Successfully created & configured timescaledb for the UNS"

  # Creates the `model` and `console` schemas and the enrichment views, then imports
  # the configured plant hierarchy as Assets. Runs after tsdb_setup_script because the
  # enrichment views are only created once their hypertables exist. Exits when done, so
  # dependents wait on service_completed_successfully rather than a healthcheck.
  asset_model_setup:
    build:
      context: .
      dockerfile: ./09_uns_model/Dockerfile
    volumes:
      - ./conf:/app/conf
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 09_uns_model
      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__table: "unifiednamespace"
      UNS_historian__metrics_table: "uns_metrics"
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
    depends_on:
      uns_timescale_db:
        condition: service_healthy
      tsdb_setup_script:
        condition: service_completed_successfully

  graphdb_client:
    build:
      context: .
      dockerfile: ./03_uns_graphdb/Dockerfile
    volumes:
      - ./conf:/app/conf
    # 9092 stays unpublished: it collides with uns_kafka_broker's host port, and Prometheus
    # scrapes graphdb_client:9092 from inside the network, exactly as it does OEE on 9095.
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 03_uns_graphdb
      UNS_mqtt__host: uns_mqtt_broker
      UNS_graphdb__url: "bolt://uns_neo4j_db:7687"
      UNS_graphdb__username: neo4j
      UNS_graphdb__password: ${UNS_graphdb__password}
      UNS_graphdb__metrics_port: 9092
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_neo4j_db:
        condition: service_healthy

  historian_client:
    build:
      context: .
      dockerfile: ./04_uns_historian/Dockerfile
    volumes:
      - ./conf:/app/conf
    ports:
      - "9091:9091"
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 04_uns_historian
      UNS_mqtt__host: uns_mqtt_broker
      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__table: "unifiednamespace"
      UNS_historian__metrics_table: "uns_metrics"
      UNS_historian__metrics_port: 9091
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_timescale_db:
        condition: service_healthy
      tsdb_setup_script:
        condition: service_completed_successfully
      asset_model_setup:
        condition: service_completed_successfully

  # Read-only OPC UA edge connector. Started with the default compose stack (no
  # profiles; prometheus depends_on it). With no opcua.servers configured it logs
  # that there is nothing to collect, stays up serving /metrics on 9093, and does
  # not connect to a PLC.
  opcua_client:
    build:
      context: .
      dockerfile: ./10_uns_opcua/Dockerfile
    volumes:
      - ./conf:/app/conf
      # The spool must outlive the container - that is the whole point of it.
      - opcua_spool:/var/lib/uns_opcua
    ports:
      - "9093:9093"
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 10_uns_opcua
      UNS_mqtt__host: uns_mqtt_broker
      UNS_opcua__metrics_port: 9093
      # The Asset Model shares the historian's database, so model_check reads these.
      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy

  spb_mapper_client:
    build:
      context: .
      dockerfile: ./05_sparkplugb/Dockerfile
    volumes:
      - ./conf:/app/conf
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 05_sparkplugb
      UNS_mqtt__host: uns_mqtt_broker
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy

  kafka_mapper_client:
    build:
      context: .
      dockerfile: ./06_uns_kafka/Dockerfile
    volumes:
      - ./conf:/app/conf
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 06_uns_kafka
      UNS_mqtt__host: uns_mqtt_broker
      UNS_kafka__config: '@json {"client.id": "uns_kafka_client", "bootstrap.servers": "uns_kafka_broker:9092", "enable.idempotence": true, "retries": 10, "compression.type": "gzip"}'
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_kafka_broker:
        condition: service_healthy

  # Computes OEE for closed shifts and publishes each result to `<line>/KPI/ShiftOee`.
  # Reads the `uns_metrics` hypertable and writes the `oee` schema; it never publishes
  # process data and never writes to a control system (ADR-0008).
  oee_client:
    build:
      context: .
      dockerfile: ./12_uns_oee/Dockerfile
    volumes:
      - ./conf:/app/conf
    # 9095 stays unpublished: Prometheus scrapes it from inside the network, exactly as it
    # does the historian's 9091, the graph database's 9092 and the simulator's 9093.
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 12_uns_oee
      UNS_mqtt__host: uns_mqtt_broker
      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__metrics_table: "uns_metrics"
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
      UNS_oee__metrics_port: 9095
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_timescale_db:
        condition: service_healthy
      tsdb_setup_script:
        condition: service_completed_successfully
      # Creates the `oee` schema and imports conf/oee/*.yaml. Without it the first pass
      # finds no OeeUnit rows and does nothing, which is silent.
      asset_model_setup:
        condition: service_completed_successfully

  uns_simulator:
    build:
      context: .
      dockerfile: ./99_simulator/Dockerfile
    # Uncomment to reach the control API from the host — needed for `npm run dev` against a
    # composed stack, and for the curl checks in the plan's Manual Verification.
    #
    # Commented out by default because the API has no user identity: anyone who can reach
    # 8099 can stop the simulator, switch its profile, or disable a device (spec 10). Inside
    # the compose network `uns_frontend`'s nginx reaches it by service name and no host port
    # is needed, so publishing it by default would widen the reachable surface for nothing.
    #
    # 9093 stays unpublished either way: Prometheus scrapes it from inside the network,
    # exactly as it does the historian's 9091 and the graph database's 9092.
    # ports:
    #   - "8099:8099"
    volumes:
      - ./conf:/app/conf
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 99_simulator
      UNS_mqtt__host: uns_mqtt_broker
      UNS_simulation__duration: "0"
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy

  graphql_server:
    build:
      context: .
      dockerfile: ./07_uns_graphql/Dockerfile
    volumes:
      - ./conf:/app/conf
    ports:
      - "8000:8000"
    environment:
      UNS_CONF_DIR: /app/conf
      UNS_MODULE: 07_uns_graphql
      UNS_mqtt__host: uns_mqtt_broker

      UNS_graphdb__url: "bolt://uns_neo4j_db:7687"
      UNS_graphdb__username: neo4j
      UNS_graphdb__password: ${UNS_graphdb__password}

      UNS_historian__hostname: uns_timescale_db
      UNS_historian__database: "uns_historian"
      UNS_historian__table: "unifiednamespace"
      UNS_historian__username: uns_dbuser
      UNS_historian__password: ${UNS_historian__password}
      UNS_kafka__config: '@json {"client.id": "uns_graphql_server", "group.id": "graphql", "bootstrap.servers": "uns_kafka_broker:29092", "auto.offset.reset": "earliest"}'
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_neo4j_db:
        condition: service_healthy
      uns_timescale_db:
        condition: service_healthy
      tsdb_setup_script:
        condition: service_completed_successfully
      asset_model_setup:
        condition: service_completed_successfully
      uns_kafka_broker:
        condition: service_healthy

  # Identity provider for the console and Grafana (ADR-0009). The console proxies /auth
  # on its own origin, so tokens carry exactly one issuer and Grafana's session cookie
  # is same-origin; publishing 8080 would invite a second issuer URL.
  uns_keycloak:
    image: "quay.io/keycloak/keycloak:26.0"
    # 8080 stays unpublished. The console proxies /auth (nginx on 8088), so the realm has
    # exactly one issuer URL.
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${UNS_keycloak__admin_password}
      # Tokens must carry the issuer the browser used, not the container hostname, or the
      # console's OIDC library rejects its own token.
      KC_HOSTNAME: http://localhost:8088/auth
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Without this the management interface (9000, where /health/ready lives) never
      # starts and the healthcheck below refuses every connection.
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      UNS_KEYCLOAK_GRAFANA_CLIENT_SECRET: ${UNS_keycloak__grafana_client_secret}
    volumes:
      - ./conf/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # 26.x serves health on the management port, which start-dev exposes on 9000, and
      # --http-relative-path applies there too — hence /auth/health/ready, not /health/ready.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  uns_frontend:
    build:
      context: .
      dockerfile: ./11_frontend/Dockerfile
      args:
        VITE_GRAPHQL_URL: /graphql
    ports:
      - "8088:80"
    depends_on:
      - graphql_server
      # nginx.conf proxies /simulator to it, and nginx will not start on an unresolvable
      # upstream hostname.
      - uns_simulator
      # nginx.conf proxies /grafana to it. Without this, System Operations shows the SPA
      # fallback instead of the dashboards.
      - uns_grafana
      # nginx.conf proxies /auth to it — same reason: nginx refuses to start when an
      # upstream hostname does not resolve.
      - uns_keycloak

  uns_prometheus:
    image: "prom/prometheus:latest"
    ports:
      - "9090:9090"
    volumes:
      - ./08_uns_observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - historian_client
      - graphdb_client
      - uns_simulator
      - opcua_client
      - oee_client

  uns_grafana:
    image: "grafana/grafana:latest"
    # 3000 stays unpublished: the console proxies /grafana (nginx on 8088, Vite in
    # development). Publishing 3000 collided with whatever already bound it on the host.
    environment:
      # ADR-0001 accepted anonymous access with org role Admin as a known gap and named OIDC
      # as the target. This is that target: anonymous is explicitly off — not merely absent,
      # so the file states the decision rather than relying on Grafana's default.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # The console embeds Grafana in an iframe and the operator has already signed in to the
      # same realm on the same origin, so a second visible sign-in step would be noise.
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: uns-grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${UNS_keycloak__grafana_client_secret}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email roles"
      # The browser is redirected to the auth URL, so it is the published origin. The token
      # and userinfo calls are Grafana's own, server to server, so they use the container name.
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "http://localhost:8088/auth/realms/uns/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://uns_keycloak:8080/auth/realms/uns/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://uns_keycloak:8080/auth/realms/uns/protocol/openid-connect/userinfo"
      # admin -> Admin, engineer -> Editor, everything else Viewer (spec section 9). The
      # realm's uns-grafana client publishes a flat multivalued `roles` claim, which is what
      # this path reads. An operator gets Viewer: a plant dashboard is not something a shift
      # operator should be able to rewrite mid-shift.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'engineer') && 'Editor' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
      # Removing anonymity without keeping embedding on breaks all three console embeds.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "http://localhost:8088/grafana/"
      GF_INSTALL_PLUGINS: grafana-mqtt-datasource
      UNS_HISTORIAN_PASSWORD: ${UNS_historian__password}
    volumes:
      - ./08_uns_observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./08_uns_observability/grafana/provisioning/datasources/datasources.yaml.template:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./08_uns_observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      uns_mqtt_broker:
        condition: service_healthy
      uns_timescale_db:
        condition: service_healthy
      tsdb_setup_script:
        condition: service_completed_successfully
      # Dashboards read the enriched views, which this service creates.
      asset_model_setup:
        condition: service_completed_successfully
      uns_prometheus:
        condition: service_started
      # The OEE dashboard's panels read the `oee` schema. `asset_model_setup` creates it,
      # so this is not about the tables existing - it is so that a stack brought up for a
      # demo has the engine running before anybody opens the dashboard.
      oee_client:
        condition: service_started
      # OAuth endpoints point at Keycloak; without this the first login can race a
      # half-started IdP and fail with a confusing upstream error.
      uns_keycloak:
        condition: service_healthy

volumes:
  opcua_spool:
