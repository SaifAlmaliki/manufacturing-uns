worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Drop client-supplied edge identity headers; only the mTLS terminator may set them.
    map $http_x_uns_trusted_proxy $strip_edge_identity {
        default 1;
        "1" 0;
    }

    server {
        listen 8080;
        server_name _;
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }

    server {
        listen 443 ssl http2;
        server_name uns.example.com;

        ssl_certificate /etc/uns/tls/console/fullchain.pem;
        ssl_certificate_key /etc/uns/tls/console/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            set $frontend_upstream uns_frontend;
            proxy_pass http://$frontend_upstream:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 443 ssl http2;
        server_name enroll.uns.example.com;

        ssl_certificate /etc/uns/tls/enrollment/fullchain.pem;
        ssl_certificate_key /etc/uns/tls/enrollment/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            set $graphql_upstream graphql_server;
            proxy_pass http://$graphql_upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-UNS-Trusted-Proxy 1;
            proxy_set_header X-Edge-Id "";
            proxy_set_header X-Edge-Cert-Purpose "";
            proxy_set_header X-Edge-Cert-Serial "";
        }
    }

    server {
        listen 443 ssl http2;
        server_name edge-mgmt.uns.example.com;

        ssl_certificate /etc/uns/tls/management/fullchain.pem;
        ssl_certificate_key /etc/uns/tls/management/privkey.pem;
        ssl_client_certificate /etc/uns/tls/management/ca.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            set $graphql_upstream graphql_server;
            proxy_pass http://$graphql_upstream:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-UNS-Trusted-Proxy 1;
            proxy_set_header X-Edge-Id $ssl_client_s_dn;
            proxy_set_header X-Edge-Cert-Purpose management;
            proxy_set_header X-Edge-Cert-Serial $ssl_client_serial;
        }
    }
}
