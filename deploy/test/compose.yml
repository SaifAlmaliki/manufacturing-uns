# Isolated cloud / DMZ / OT acceptance harness for cloud-edge qualification.
# No production credentials or volumes. Simulator -> edge -> cloud only.
name: uns-cloud-edge-qualification

x-stub-build: &stub_build
  context: ../..
  dockerfile: deploy/test/support/Dockerfile.stub

networks:
  cloud:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  dmz:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24
  ot:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.30.0/24
  dmgmt:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.21.0/24

services:
  test-router:
    image: alpine:3.21
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      DMZ_MGMT_ADDR: 172.30.21.10
    volumes:
      - ./firewall-rules.sh:/etc/firewall-rules.sh:ro
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache iptables iproute2 conntrack-tools >/dev/null
        chmod +x /etc/firewall-rules.sh
        /etc/firewall-rules.sh apply
        tail -f /dev/null
    networks:
      cloud:
        ipv4_address: 172.30.10.254
      dmz:
        ipv4_address: 172.30.20.254
      ot:
        ipv4_address: 172.30.30.254
      dmgmt:
        ipv4_address: 172.30.21.254
    healthcheck:
      test: ["CMD", "test", "-f", "/var/run/uns-firewall.ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  cloud-management:
    build:
      <<: *stub_build
    command: ["cloud_management_stub.py"]
    networks:
      cloud:
        ipv4_address: 172.30.10.20
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import ssl,urllib.request; ctx=ssl.create_default_context(cafile='/qualification-ca/ca.crt'); urllib.request.urlopen('https://127.0.0.1:443/health', context=ctx, timeout=2)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  qualification-kafka-mapper:
    build:
      <<: *stub_build
    command: ["qualification_kafka_mapper.py"]
    depends_on:
      cloud-mqtt:
        condition: service_healthy
      cloud-kafka:
        condition: service_healthy
    networks:
      cloud:
        ipv4_address: 172.30.10.70

  qualification-lake-sink:
    build:
      <<: *stub_build
    command: ["qualification_lake_sink.py"]
    depends_on:
      cloud-kafka:
        condition: service_healthy
      cloud-minio:
        condition: service_healthy
    networks:
      cloud:
        ipv4_address: 172.30.10.80

  edge-bridge:
    build:
      <<: *stub_build
    command: ["edge_bridge_stub.py"]
    environment:
      EDGE_MQTT_PORT: "8883"
    depends_on:
      hivemq-edge:
        condition: service_healthy
      cloud-mqtt:
        condition: service_healthy
    networks:
      dmz:
        ipv4_address: 172.30.20.40
      cloud:
        ipv4_address: 172.30.10.90

  cloud-mqtt:
    image: eclipse-mosquitto:2.0.20
    networks:
      cloud:
        ipv4_address: 172.30.10.30
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 2 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  cloud-kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cloud-kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cloud-kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://cloud-kafka:29092,CONTROLLER://cloud-kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      cloud:
        ipv4_address: 172.30.10.40
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  cloud-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: qualification
      MINIO_ROOT_PASSWORD: qualification-test-only
    networks:
      cloud:
        ipv4_address: 172.30.10.50
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  dmz-management:
    build:
      <<: *stub_build
    command: ["dmz_management_stub.py"]
    networks:
      dmgmt:
        ipv4_address: 172.30.21.10
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 12

  uns-edge-agent:
    build:
      <<: *stub_build
    command: ["edge_agent_stub.py"]
    environment:
      EDGE_MANAGEMENT_URL: http://dmz-management:8443/health
      EDGE_ID: edge-01
      CLOUD_MANAGEMENT_HOST: cloud-management
      CLOUD_MANAGEMENT_PORT: 443
    depends_on:
      dmz-management:
        condition: service_healthy
      cloud-management:
        condition: service_healthy
    networks:
      dmz:
        ipv4_address: 172.30.20.20
      dmgmt:
        ipv4_address: 172.30.21.20
      cloud:

  hivemq-edge:
    image: hivemq/hivemq-edge:latest
    volumes:
      - ./hivemq-edge/config.xml:/opt/hivemq/conf/config.xml:ro
    networks:
      dmz:
        ipv4_address: 172.30.20.30
      ot:
        ipv4_address: 172.30.30.30
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/8883' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  protocol-collector:
    build:
      <<: *stub_build
    command: ["protocol_collector_stub.py"]
    environment:
      EDGE_ID: edge-01
      EDGE_MQTT_PORT: "8883"
      FIXTURE_PROFILE: edge_simulation
      FIXTURE_PROFILE_FILE: /app/fixtures.json
    depends_on:
      hivemq-edge:
        condition: service_healthy
      cloud-management:
        condition: service_healthy
      opcua-simulator:
        condition: service_healthy
      modbus-simulator:
        condition: service_healthy
    networks:
      dmz:
        ipv4_address: 172.30.20.55
      ot:
        ipv4_address: 172.30.30.55
      cloud:

  opcua-simulator:
    build:
      context: ../..
      dockerfile: conf/simulator/protocols/Dockerfile.opcua
    environment:
      FIXTURE_PROFILE: qualification
    networks:
      ot:
        ipv4_address: 172.30.30.10
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',4840),2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  modbus-simulator:
    build:
      context: ../..
      dockerfile: conf/simulator/protocols/Dockerfile.modbus
    environment:
      FIXTURE_PROFILE: qualification
    networks:
      ot:
        ipv4_address: 172.30.30.20
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',1502),2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  oee-simulator:
    build:
      context: ../..
      dockerfile: conf/simulator/Dockerfile
    environment:
      H: hivemq-edge
      P: 8883
    depends_on:
      hivemq-edge:
        condition: service_healthy
    networks:
      ot:
        ipv4_address: 172.30.30.40

  multi-system-simulator:
    build:
      context: ../..
      dockerfile: conf/simulator/Dockerfile.multi-system
    environment:
      MQTT_HOST: hivemq-edge
      MQTT_PORT: 8883
      SITE_ID: cloud-edge-qualification
    depends_on:
      hivemq-edge:
        condition: service_healthy
    networks:
      ot:
        ipv4_address: 172.30.30.50

  cloud-probe:
    image: alpine:3.21
    command: ["sleep", "infinity"]
    networks:
      cloud:
        ipv4_address: 172.30.10.60

  dmz-probe:
    image: alpine:3.21
    command: ["sleep", "infinity"]
    depends_on:
      test-router:
        condition: service_healthy
    networks:
      dmz:
        ipv4_address: 172.30.20.60

  ot-probe:
    image: alpine:3.21
    command: ["sleep", "infinity"]
    depends_on:
      test-router:
        condition: service_healthy
    networks:
      ot:
        ipv4_address: 172.30.30.60
