server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    location /graphql {
        proxy_pass http://graphql_server:8000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # The simulator's control API. Must come before `location /`, whose try_files would
    # otherwise answer every /simulator request with index.html — a 200 full of HTML, which
    # is harder to diagnose than a refused connection.
    # Variable upstream so nginx starts when uns_simulator is scaled to 0
    # (`npm run stack`). Vite on :5173 still uses :8088/auth for OIDC.
    location /simulator {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $simulator_upstream uns_simulator;
        proxy_pass http://$simulator_upstream:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Grafana Process Visualization, OEE, and Platform Observability. Must come before
    # `location /` or the SPA fallback returns index.html for every dashboard URL.
    location /grafana/ {
        proxy_pass http://uns_grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    # Keycloak. Must come before `location /`, whose try_files would otherwise answer the
    # sign-in redirect with index.html — a 200 full of HTML where a redirect was expected.
    # Deliberately not proxied by Vite in dev: OIDC discovery hands the browser absolute
    # URLs minted from KC_HOSTNAME, so a dev session on 5173 uses :8088/auth directly.
    location /auth/ {
        proxy_pass http://uns_keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8088;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
