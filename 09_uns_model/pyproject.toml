[project]
name = "uns_model"
version = "0.9.38"
description = "Authored Asset Model and read-time Enrichment for a UNS setup"
authors = [{ name = "Ashwin Krishnan", email = "mkashwin@gmail.com" }]
requires-python = ">=3.14, <4"
readme = "README.md"
license = { text = "MIT" }
maintainers = [
    { name = "Himanshu Dhami", email = "himanshudhami@gmail.com" },
    { name = "Johan Jeppson", email = "logic4human@gmail.com" },
]
keywords = [
    "uns",
    "isa-95",
    "asset model",
    "contextualization",
    "postgres",
    "sqlalchemy",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Development Status :: 4 - Beta",
    "Topic :: Communications",
]
dependencies = [
    "logger~=1.4",
    "uns_config",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.31.0,<0.32",
    "alembic>=1.14.0,<2",
    "dynaconf~=3.2",
]

[project.urls]
Repository = "https://github.com/mkashwin/unifiednamespace/tree/main/09_uns_model"

[project.scripts]
uns_model_migrate = "uns_model.cli:migrate"
uns_model_seed = "uns_model.cli:seed"
uns_model_setup = "uns_model.cli:main"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10",
    "pytest-xdist>=3.8.0,<4",
    "pytest-timeout>=2.4.0,<3",
    "pytest-asyncio>=1.3.0,<1.5",
    "pytest-cov>=6.0.0,<8",
    "safety>=3.4.0,<4",
]

[tool.uv]
default-groups = ["test"]

[tool.uv.sources]
uns_config = { path = "../00_uns_config", editable = true }

[tool.hatch.build.targets.sdist]
include = ["src/uns_model", "migrations", "alembic.ini"]

[tool.hatch.build.targets.wheel]
include = ["src/uns_model", "migrations", "alembic.ini"]

[tool.hatch.build.targets.wheel.sources]
"src/uns_model" = "uns_model"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
norecursedirs = [".git", "build", "node_modules", "env*", "tmp*"]
testpaths = ["test"]
markers = ["integrationtest: mark a test as an integration test"]
addopts = "--timeout=300"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
# Extend the `pyproject.toml` file in the parent directory...
extend = "../pyproject.toml"
