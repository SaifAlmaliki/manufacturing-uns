"""One Asset root of an Access Group."""
type AccessGroupRootType {
  assetId: Int64!
  path: String!
  segment: String!
  level: String!
}

"""A named Access Group: who may see which Asset subtree."""
type AccessGroupType {
  id: Int64!
  name: String!
  roots: [AccessGroupRootType!]!
