}

"""What kind of condition the rule watches, used for grouping and icons."""
enum AlertCategory {
  TEMPERATURE
  PRESSURE
  VIBRATION
  FLOW_RATE
  STALE_TIMEOUT
  NODE_OFFLINE
  COMMUNICATION
  THRESHOLD
  SAFETY
  CUSTOM
}

"""How the metric is compared against the threshold."""
enum AlertCondition {
  GREATER_THAN
  LESS_THAN
  EQUALS
  NOT_EQUALS
  RANGE_OUTSIDE
  STALE_TIMEOUT
  CONTAINS
}

"""An Alert Rule to create or replace. The id is supplied by the console."""
input AlertRuleInput {
  id: String!
  name: String!
  severity: AlertSeverity!
  category: AlertCategory!
  topic: String!
  metricField: String!
  condition: AlertCondition!

  """A JSON scalar: a number, a string or a boolean"""
  thresholdValue: JSON!
  description: String! = ""
  enabled: Boolean! = true
  thresholdUpperValue: Float = null
  unit: String = null
  delaySeconds: Int64! = 0
  escalationRole: ConsoleRole = null
  escalationTimeoutMinutes: Int64 = null
  notifyRoles: [ConsoleRole!]! = []
  autoResolveOnNormal: Boolean! = true
  inAppNotification: Boolean! = true
  audioChime: Boolean! = true
  mqttPublishOnTrigger: Boolean! = false
  mqttAlarmTopic: String = null
  emailWebhook: Boolean! = false
  webhookUrl: String = null
}

"""How many Alert Rules exist and how many are armed."""
type AlertRuleSummary {
  rules: Int64!
  enabledRules: Int64!

  """When any rule was last edited, so a console can skip a refetch"""
  lastChangedAt: DateTime
}

"""
An ISA-18.2 Alert Rule as authored in the console and stored in Postgres.
"""
type AlertRuleType {
  id: String!
  name: String!
  description: String!
  enabled: Boolean!
  severity: AlertSeverity!
  category: AlertCategory!

  """The topic the rule watches. May contain MQTT wildcards."""
  topic: String!

  """Which field of the payload is compared, e.g. 'value'"""
  metricField: String!
  condition: AlertCondition!

  """
  The threshold as a JSON scalar, so a rule can compare numbers, text or flags
  """
  thresholdValue: JSON!

  """Upper bound for RANGE_OUTSIDE"""
  thresholdUpperValue: Float

  """
  Unit as typed by the engineer. Not a Metric Definition unit_of_measure.
  """
  unit: String
  delaySeconds: Int64!
  escalationRole: ConsoleRole
  escalationTimeoutMinutes: Int64
  notifyRoles: [ConsoleRole!]!
  autoResolveOnNormal: Boolean!
  inAppNotification: Boolean!
  audioChime: Boolean!
  mqttPublishOnTrigger: Boolean!
  mqttAlarmTopic: String
  emailWebhook: Boolean!
  webhookUrl: String
  triggerCount: Int64!
  lastTriggeredAt: DateTime
  lastEvaluatedAt: DateTime
  createdAt: DateTime
  updatedAt: DateTime
}

"""How badly an operator needs to care, per ISA-18.2 priority."""
enum AlertSeverity {
  CRITICAL
  HIGH
  WARNING
  INFO
}

"""How complete the Asset Model is."""
type AssetModelSummary {
  assets: Int64!
  metricDefinitions: Int64!
  boundTopics: Int64!

  """
  Topics that have published data but match no Asset. Non-zero means the model is incomplete.
  """
  unmodelledTopics: Int64!
}

"""A declared thing in the plant: a Site, a Line, a Machine."""
type AssetNode {
  """
  Topic prefix this Asset publishes under, e.g. 'Ent/Site/Area/Line1/Cell1/G1'
  """
  path: String!

  """The single topic segment naming this Asset, e.g. 'G1'"""
  segment: String!

  """
  Asset Level, e.g. SITE, LINE, WORK_CELL, MACHINE. Levels may be skipped.
  """
  level: String!

  """Display name if one was authored, otherwise the segment"""
  name: String!
  description: String
  manufacturer: String
  modelNumber: String
  serialNumber: String
  criticality: String
  isActive: Boolean!

  """Site-specific facts that do not deserve a column"""
  attributes: JSONPayload
}

"""
Represents binary data as Base64-encoded strings, using the standard alphabet.
"""
scalar Base64 @specifiedBy(url: "https://datatracker.ietf.org/doc/html/rfc4648.html#section-4")

enum BinaryOperator {
  OR
  AND
  NOT
}

type BytesPayload {
  data: Base64!
}

"""A console role that can be notified when a rule fires."""
enum ConsoleRole {
  ADMIN
  ENGINEER
  OPERATOR
  AUDITOR
  VIEWER
}

"""Date with time (isoformat)"""
scalar DateTime

"""One stop, with the reason it is attributed to."""
type DowntimeEvent {
  id: ID!
  assetPath: String!

  """The shift this stop is counted against."""
  shiftStart: DateTime!
  startedAt: DateTime!
  endedAt: DateTime!
  durationS: Float!

  """The published state that held for the whole stop, e.g. 'ABORTED'."""
  stateValue: String!
  reasonCode: String!
  reasonDisplayName: String!
  reasonCategory: String!
  isPlanned: Boolean!
  reasonSource: ReasonSource!
  assignedBy: String
  assignedAt: DateTime
  note: String!
}

"""One reason code's share of the downtime in a window, largest first."""
type DowntimeParetoBucket {
  reasonCode: String!
  displayName: String!
  category: String!
  isPlanned: Boolean!
  eventCount: Int64!
  totalSeconds: Float!

  """
  Fraction of the window's total downtime, 0..1. Zero when nothing was lost.
  """
  share: Float!
}

