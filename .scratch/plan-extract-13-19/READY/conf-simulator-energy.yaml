# conf/simulator/energy.yaml
# Spec 8.1. Electrical metering: incomer, transformer, two motor control centres.
# ActivePower is the only primary signal on a meter; the rest of the power triangle is
# derived from it, so the seven values stay mutually consistent on every tick.

devices:
  - id: EM-01
    equipment: EM-01
    target: {site: Dormagen, area: Utilities, line: PowerDistribution, cell: MainIncomer}
    serves: [Dormagen/Production/Line1, Dormagen/Production/Line2]
    tier: energy
    signals:
      ActivePower:
        shape: derived
        unit: kW
        expr: base_load + ctx.served_production * connected_kw
        params: {base_load: 220.0, connected_kw: 1450.0}
        precision: 1
        range: [0, 2000]
        limits: {hi: 1800, hihi: 1950}
        export_metric: true
      ReactivePower:
        shape: derived
        unit: kVAr
        expr: ActivePower * tan_phi
        params: {tan_phi: 0.44}
        precision: 1
        range: [0, 1200]
      ApparentPower:
        shape: derived
        unit: kVA
        expr: sqrt(ActivePower * ActivePower + ReactivePower * ReactivePower)
        precision: 1
        range: [0, 2400]
      PowerFactor:
        # max(..., 1.0) rather than a raw divide: at a dead plant both powers are zero and
        # this is a division by zero, not a small number.
        shape: derived
        unit: "1"
        expr: ActivePower / max(ApparentPower, 1.0)
        precision: 3
        range: [0, 1]
        limits: {lo: 0.9, lolo: 0.85}
      VoltageL1:
        shape: ou_walk
        unit: V
        mean: 400.0
        sigma: 1.2
        tau: 45.0
        precision: 1
        range: [370, 430]
        limits: {lo: 380, hi: 420}
      VoltageL2:
        shape: ou_walk
        unit: V
        mean: 399.4
        sigma: 1.2
        tau: 45.0
        precision: 1
        range: [370, 430]
        limits: {lo: 380, hi: 420}
      VoltageL3:
        shape: ou_walk
        unit: V
        mean: 400.6
        sigma: 1.2
        tau: 45.0
        precision: 1
        range: [370, 430]
        limits: {lo: 380, hi: 420}
      CurrentL1:
        shape: derived
        unit: A
        expr: ApparentPower * 1000.0 / (sqrt(3.0) * max(VoltageL1, 1.0))
        precision: 1
        range: [0, 3500]
      CurrentL2:
        shape: derived
        unit: A
        expr: ApparentPower * 1000.0 / (sqrt(3.0) * max(VoltageL2, 1.0))
        precision: 1
        range: [0, 3500]
      CurrentL3:
        shape: derived
        unit: A
        expr: ApparentPower * 1000.0 / (sqrt(3.0) * max(VoltageL3, 1.0))
        precision: 1
        range: [0, 3500]
      Frequency:
        shape: ou_walk
        unit: Hz
        mean: 50.0
        sigma: 0.015
        tau: 30.0
        precision: 3
        range: [49.0, 51.0]
        limits: {lo: 49.8, hi: 50.2}
      VoltageThd:
        shape: ou_walk
        unit: "%"
        mean: 2.4
        sigma: 0.35
        tau: 180.0
        precision: 2
        range: [0, 12]
        limits: {hi: 5.0, hihi: 8.0}
      EnergyTotal:
        # kW divided by 3600 is kWh per second, and `rate` is per second. Getting this
        # wrong by 3600 is the easiest mistake in the file and the hardest to spot: the
        # register still rises monotonically, just absurdly fast.
        shape: counter
        unit: kWh
        rate: ActivePower / 3600.0
        initial: 84000.0
        tier: meter
        precision: 1
        export_metric: true
      ReactiveEnergyTotal:
        shape: counter
        unit: kVArh
        rate: ReactivePower / 3600.0
        initial: 31000.0
        tier: meter
        precision: 1
      PeakDemand:
        shape: window_agg
        unit: kW
        source: ActivePower
        agg: max
        window_s: 900.0
        tier: meter
        precision: 1
      EnergyIntensity:
        # kWh per tonne. The 0.1 floor is not cosmetic: an idle line makes the true
        # intensity infinite, and a topic reporting 1/0 is worse than one reporting the
        # intensity a very slow line would have.
        shape: derived
        unit: kWh/t
        expr: ActivePower / max(ctx.served_throughput_tph, 0.1)
        tier: meter
        precision: 2
        range: [0, 2000]
      CarbonRate:
        shape: derived
        unit: kgCO2/h
        expr: ActivePower * ctx.grid_co2_g_per_kwh / 1000.0
        precision: 2
        range: [0, 900]

  - id: EM-02
    equipment: EM-02
    target: {site: Krefeld, area: Utilities, line: PowerDistribution, cell: MainIncomer}
    serves: [Krefeld/Production/Line1]
    tier: energy
    signals:
      ActivePower:
        shape: derived
        unit: kW
        expr: base_load + ctx.served_production * connected_kw
        params: {base_load: 90.0, connected_kw: 520.0}
        precision: 1
        range: [0, 800]
        limits: {hi: 700, hihi: 760}
        export_metric: true
      ReactivePower:
        shape: derived
        unit: kVAr
        expr: ActivePower * tan_phi
        params: {tan_phi: 0.48}
        precision: 1
        range: [0, 500]
      ApparentPower:
        shape: derived
        unit: kVA
        expr: sqrt(ActivePower * ActivePower + ReactivePower * ReactivePower)
        precision: 1
        range: [0, 1000]
      PowerFactor:
        shape: derived
        unit: "1"
        expr: ActivePower / max(ApparentPower, 1.0)
        precision: 3
        range: [0, 1]
        limits: {lo: 0.9, lolo: 0.85}
      VoltageL1:
        shape: ou_walk
        unit: V
        mean: 400.0
        sigma: 1.4
        tau: 45.0
        precision: 1
        range: [370, 430]
        limits: {lo: 380, hi: 420}
      VoltageL2:
        shape: ou_walk
        unit: V
        mean: 400.8
        sigma: 1.4
        tau: 45.0
        precision: 1
        range: [370, 430]
        limits: {lo: 380, hi: 420}
      VoltageL3:
        shape: ou_walk
        unit: V
        mean: 399.2
        sigma: 1.4
        tau: 45.0
        precision: 1
        range: [370, 430]
        limits: {lo: 380, hi: 420}
      CurrentL1:
        shape: derived
        unit: A
        expr: ApparentPower * 1000.0 / (sqrt(3.0) * max(VoltageL1, 1.0))
        precision: 1
        range: [0, 1500]
      CurrentL2:
        shape: derived
        unit: A
        expr: ApparentPower * 1000.0 / (sqrt(3.0) * max(VoltageL2, 1.0))
        precision: 1
        range: [0, 1500]
      CurrentL3:
        shape: derived
        unit: A
        expr: ApparentPower * 1000.0 / (sqrt(3.0) * max(VoltageL3, 1.0))
        precision: 1
        range: [0, 1500]
      Frequency:
        shape: ou_walk
        unit: Hz
        mean: 50.0
        sigma: 0.015
        tau: 30.0
        precision: 3
        range: [49.0, 51.0]
        limits: {lo: 49.8, hi: 50.2}
      VoltageThd:
        shape: ou_walk
        unit: "%"
        mean: 2.8
        sigma: 0.4
        tau: 180.0
        precision: 2
        range: [0, 12]
        limits: {hi: 5.0, hihi: 8.0}
      EnergyTotal:
        shape: counter
        unit: kWh
        rate: ActivePower / 3600.0
        initial: 29500.0
        tier: meter
        precision: 1
        export_metric: true
      ReactiveEnergyTotal:
        shape: counter
        unit: kVArh
        rate: ReactivePower / 3600.0
        initial: 11200.0
        tier: meter
        precision: 1
      PeakDemand:
        shape: window_agg
        unit: kW
        source: ActivePower
        agg: max
        window_s: 900.0
        tier: meter
        precision: 1
      EnergyIntensity:
        shape: derived
        unit: kWh/t
        expr: ActivePower / max(ctx.served_throughput_tph, 0.1)
        tier: meter
        precision: 2
        range: [0, 2000]
      CarbonRate:
        shape: derived
        unit: kgCO2/h
        expr: ActivePower * ctx.grid_co2_g_per_kwh / 1000.0
        precision: 2
        range: [0, 400]

  - id: TR-01
    equipment: TR-01
    # No `site`: Transformer_T1 is a Dormagen-only cell name, so the cell is the selector.
    target: {area: Utilities, line: PowerDistribution, cell: Transformer_T1}
    serves: [Dormagen/Production/Line1, Dormagen/Production/Line2]
    tier: energy
    signals:
      LoadPercent:
        shape: derived
        unit: "%"
        expr: idle_pct + ctx.served_production * span_pct
        params: {idle_pct: 14.0, span_pct: 62.0}
        precision: 1
        range: [0, 120]
        limits: {hi: 95, hihi: 110}
      OilTemperature:
        # Spec 8.1: rises with load and with ambient. Ambient sets the floor the oil can
        # never cool below; load sets how far above that floor it sits.
        shape: derived
        unit: "°C"
        expr: ctx.ambient_temp_c + rise_k * LoadPercent / 100.0
        params: {rise_k: 48.0}
        precision: 1
        range: [-20, 120]
        limits: {hi: 85, hihi: 95}
      WindingTemperature:
        shape: derived
        unit: "°C"
        expr: OilTemperature + hotspot_k * LoadPercent / 100.0
        params: {hotspot_k: 22.0}
        precision: 1
        range: [-20, 150]
        limits: {hi: 105, hihi: 120}
      TapPosition:
        # `weights` rather than a repeated 0 in `choices`: both bias the draw towards the
        # nominal tap, but only one of them says so.
        shape: stepped
        unit: "1"
        choices: [-2, -1, 0, 1, 2]
        weights: [1, 2, 6, 2, 1]
        dwell_s: 3600.0
        tier: status
        param_type: Status
        precision: 0
      CoolingFanStatus:
        # Spec 8.1 says stepped, and stepped's `source` reads `ctx`, not siblings - so this
        # cannot be driven from OilTemperature and is an honest dwell-timer discrete rather
        # than a fake correlation. The temperature signals above carry the load story.
        shape: stepped
        unit: "1"
        choices: ["Off", "Stage1", "Stage2"]
        weights: [4, 3, 1]
        dwell_s: 900.0
        tier: status
        param_type: Status
      EnergyThroughput:
        shape: counter
        unit: kWh
        rate: LoadPercent * rated_kva / 100.0 / 3600.0
        params: {rated_kva: 2500.0}
        initial: 156000.0
        tier: meter
        precision: 1

  - id: MCC-01
    equipment: MCC-01
    target: {area: Utilities, line: PowerDistribution, cell: MCC_Production}
    serves: [Dormagen/Production/Line1, Dormagen/Production/Line2]
    tier: energy
    signals:
      ActivePower:
        shape: derived
        unit: kW
        expr: base_load + ctx.served_production * connected_kw
        params: {base_load: 35.0, connected_kw: 610.0}
        precision: 1
        range: [0, 800]
        limits: {hi: 700, hihi: 760}
      Current:
        shape: derived
        unit: A
        expr: ActivePower * 1000.0 / (sqrt(3.0) * nominal_v * pf)
        params: {nominal_v: 400.0, pf: 0.91}
        precision: 1
        range: [0, 1400]
      EnergyTotal:
        shape: counter
        unit: kWh
        rate: ActivePower / 3600.0
        initial: 42000.0
        tier: meter
        precision: 1
      FeederTripCount:
        # `rate` is per second, so this is about one trip a fortnight. A counter rather
        # than an event because what a maintenance engineer asks for is the running total.
        shape: counter
        unit: "1"
        rate: 0.0000008
        initial: 3.0
        tier: meter
        precision: 0
      InsulationResistance:
        shape: ou_walk
        unit: "MΩ"
        mean: 180.0
        sigma: 12.0
        tau: 3600.0
        precision: 1
        range: [0, 500]
        limits: {lo: 50, lolo: 20}
      BusbarTemperature:
        shape: derived
        unit: "°C"
        expr: ctx.ambient_temp_c + rise_k * ctx.served_production
        params: {rise_k: 26.0}
        precision: 1
        range: [-20, 120]
        limits: {hi: 70, hihi: 85}

  - id: MCC-02
    equipment: MCC-02
    # No `serves`: this centre feeds the utility side, so there is no production for its
    # load to follow and an ou_walk is the honest shape.
    target: {area: Utilities, line: PowerDistribution, cell: MCC_Utilities}
    tier: energy
    signals:
      ActivePower:
        shape: ou_walk
        unit: kW
        mean: 310.0
        sigma: 18.0
        tau: 240.0
        precision: 1
        range: [0, 600]
        limits: {hi: 520, hihi: 560}
      Current:
        shape: derived
        unit: A
        expr: ActivePower * 1000.0 / (sqrt(3.0) * nominal_v * pf)
        params: {nominal_v: 400.0, pf: 0.89}
        precision: 1
        range: [0, 1100]
      EnergyTotal:
        shape: counter
        unit: kWh
        rate: ActivePower / 3600.0
        initial: 61000.0
        tier: meter
        precision: 1
      FeederTripCount:
        shape: counter
        unit: "1"
        rate: 0.0000005
        initial: 1.0
        tier: meter
        precision: 0
      InsulationResistance:
        shape: ou_walk
        unit: "MΩ"
        mean: 165.0
        sigma: 14.0
        tau: 3600.0
        precision: 1
        range: [0, 500]
        limits: {lo: 50, lolo: 20}
      BusbarTemperature:
        shape: derived
        unit: "°C"
        expr: ctx.ambient_temp_c + rise_k * ActivePower / rated_kw
        params: {rise_k: 24.0, rated_kw: 600.0}
        precision: 1
        range: [-20, 120]
        limits: {hi: 70, hihi: 85}
