[project]
name = "uns-simulator"
version = "0.9.38"
description = "Simulator to publishing messages into the UNS"
authors = [{ name = "Ashwin Krishnan", email = "mkashwin@gmail.com" }]
requires-python = ">=3.14, <4"
readme = "README.md"
license = { text = "MIT" }
maintainers = [
    { name = "Himanshu Dhami", email = "himanshudhami@gmail.com" },
    { name = "Johan Jeppson", email = "logic4human@gmail.com" },
]
keywords = [
    "uns",
    "simulator",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python",
     "Development Status :: 4 - Beta",
     "Topic :: Communications",
]
dependencies = [
    "logger~=1.4",
    "uns_config",
    "aiomqtt>=2.5.1,<3",
    "dynaconf~=3.2",
    "pyyaml~=6.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<0.53",
    "prometheus-client>=0.21.0,<1",
]

[project.urls]
Repository = "https://github.com/mkashwin/unifiednamespace/tree/main/99_simulator"

[project.scripts]
uns_simulator = "uns_simulator.main:main"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10",
    "pytest-xdist>=3.6.1,<4",
    "pytest-asyncio>=1.3.0,<1.5",
    "pytest-timeout>=2.4.0,<3",
    "pytest-cov>=6.0.0,<8",
    "safety>=3.7.0,<4",
    "httpx>=0.28,<1",
]

[tool.uv]
default-groups = ["test"]

[tool.uv.sources]
uns_config = { path = "../00_uns_config", editable = true }

[tool.hatch.build.targets.sdist]
include = [
    "src/uns_simulator",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/uns_simulator",
]

[tool.hatch.build.targets.wheel.sources]
"src/uns_simulator" = "uns_simulator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
norecursedirs = [".git", "build", "node_modules", "env*", "tmp*"]
testpaths = ["test"]
markers = ["integrationtest: mark a test as an integration test"]
addopts = "-n auto --timeout=300 --durations=10"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# Extend the `pyproject.toml` file in the parent directory...
extend = "../pyproject.toml"

[tool.ruff.lint]
# RUF069 (float ==) is new preview and would flag every plan test; RUF105 wants
# `ruff: ignore` instead of the repo-wide `noqa` style.
extend-ignore = ["RUF069", "RUF105"]

[tool.ruff.lint.per-file-ignores]
"test/*.py" = ["RUF043", "RUF029", "S311", "PERF401", "RUF007", "ARG001", "ARG002", "ARG005", "S105", "S106", "RUF012", "UP037", "PGH004"]
"src/uns_simulator/api.py" = ["C901"]
