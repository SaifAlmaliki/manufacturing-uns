[project]
name = "uns_config"
version = "0.9.38"
description = "Shared platform configuration loader for the Unified Namespace"
authors = [{ name = "Ashwin Krishnan", email = "mkashwin@gmail.com" }]
requires-python = ">=3.14, <4"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "dynaconf~=3.2",
    # dynaconf parses settings.yaml through pyyaml; until now it arrived transitively
    # via sibling modules, so a module-local env could not load conf at all
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
uns_compose = "uns_config.compose_env:main"

[project.urls]
Repository = "https://github.com/mkashwin/unifiednamespace/tree/main/00_uns_config"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10",
    # addopts below uses --timeout; 07 and 09 declare the same plugin
    "pytest-timeout>=2.4.0,<3",
]

[tool.uv]
default-groups = ["test"]

[tool.hatch.build.targets.sdist]
include = ["src/uns_config"]

[tool.hatch.build.targets.wheel]
include = ["src/uns_config"]

[tool.hatch.build.targets.wheel.sources]
"src/uns_config" = "uns_config"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--timeout=60"

[tool.ruff]
extend = "../pyproject.toml"
