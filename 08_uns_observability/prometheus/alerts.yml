groups:
  - name: uns_pipeline
    rules:
      - alert: UnsKafkaIngestionNotReady
        expr: min(uns_kafka_ingest_ready) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Kafka ingestion shard is not accepting MQTT deliveries

      - alert: UnsKafkaIngestionBackpressure
        expr: increase(uns_kafka_ingest_backpressure_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Kafka ingestion mapper reported backpressure or delivery failure

      - alert: UnsDatalakeNotReady
        expr: uns_datalake_ready == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Datalake mapper consumer assignment is not active

      - alert: UnsHistorianConsumerLag
        expr: histogram_quantile(0.99, sum(rate(uns_historian_consumer_lag_messages_bucket[5m])) by (le)) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Historian Kafka consumer lag is elevated
