global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: uns_historian
    static_configs:
      - targets: ["historian_client:9091"]

  - job_name: uns_graphdb
    static_configs:
      - targets: ["graphdb_client:9092"]

  - job_name: uns_opcua
    static_configs:
      - targets: ["opcua_client:9093"]

  - job_name: uns_oee
    static_configs:
      - targets: ["oee_client:9095"]

  - job_name: uns_kafka_mapper
    static_configs:
      - targets: ["kafka_mapper_client:9094"]

  - job_name: uns_datalake
    static_configs:
      - targets: ["datalake_mapper:9096"]
