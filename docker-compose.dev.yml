# Local three-terminal dev (npm run stack / sim / ui).
#
# `npm run stack` scales the simulator to 0 so the backend starts without it.
# `npm run sim` starts only uns_simulator (foreground). Port 8099 is published here
# for Vite on :5173; the main compose file keeps it unpublished by default.

services:
  uns_simulator:
    ports:
      - "8099:8099"

  uns_frontend:
    depends_on: !reset
      - graphql_server
      - uns_grafana

  uns_prometheus:
    depends_on: !reset
      - historian_client
      - graphdb_client
      - opcua_client
      - oee_client
