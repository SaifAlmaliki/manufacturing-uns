# Local overlay for `npm run stack`.

services:
  # Plant seed is AcmeWater WTP; conf/oee/*.yaml still names the old Covestro line.
  # Importing it fails the one-shot job and blocks GraphQL. Skip OEE on this overlay.
  asset_model_setup:
    command: ["--skip-oee-import"]

  # This PC's NetBIOS name is not in Docker DNS. Map it to the host so Test/Browse
  # and HiveMQ Edge OPC UA adapters can use the same opc.tcp://desktop-h4hdql2:50000/
  # URL as UA Expert. wtp2 simulators on host.docker.internal:50001 need host-gateway too.
  graphql_server:
    extra_hosts:
      - "desktop-h4hdql2:host-gateway"

  uns_mqtt_broker:
    extra_hosts:
      - "desktop-h4hdql2:host-gateway"
      - "host.docker.internal:host-gateway"

  opcua_client:
    extra_hosts:
      - "desktop-h4hdql2:host-gateway"

  uns_frontend:
    depends_on: !reset
      graphql_server:
        condition: service_healthy
      uns_grafana:
        condition: service_started
      uns_keycloak:
        condition: service_healthy

  uns_prometheus:
    depends_on: !reset
      - historian_client
      - graphdb_client
      - oee_client
      - datalake_mapper
